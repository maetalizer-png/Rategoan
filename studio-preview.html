<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data: blob:;">
</head>
<body>
<script>
var host = '';
try { host = new URLSearchParams(location.search).get('host') || ''; } catch (e) { host = ''; }
window.onerror = function (msg, url, line, col) {
  if (!host) return;
  parent.postMessage({ type: 'studio:error', error: { msg: String(msg), line: line, col: col } }, host);
};
window.addEventListener('message', function (event) {
  if (event.source !== window.parent) return;
  if (!host || event.origin !== host) return;
  var data = event.data;
  if (!data || data.type !== 'studio:srcdoc' || typeof data.html !== 'string') return;
  document.open();
  document.write(data.html);
  document.close();
});
</script>
</body>
</html>
