<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data: blob:;">
</head>
<body>
<script>
var sessionNonce = '';
window.addEventListener('message', function (event) {
  if (event.source !== window.parent) return;
  if (!event.origin) return;
  var data = event.data;
  if (!data || data.type !== 'INIT_PORT' || !event.ports || !event.ports[0]) return;
  if (!data.nonce || sessionNonce) return;
  sessionNonce = String(data.nonce);
  var port = event.ports[0];
  port.onmessage = function (e) {
    var msg = e.data || {};
    if (msg.type !== 'RENDER_PAYLOAD' || typeof msg.html !== 'string') return;
    if (!sessionNonce || msg.nonce !== sessionNonce) return;
    paintLive(msg.html);
  };
  port.postMessage({ type: 'PORT_READY' });
});
function snapshotFields() {
  var fields = [];
  document.querySelectorAll('#live-root input, #live-root textarea, #live-root select').forEach(function (el) {
    var key = el.id || el.name;
    if (key) fields.push({ key: key, value: el.value });
  });
  return fields;
}
function restoreFields(fields) {
  fields.forEach(function (row) {
    var el = document.getElementById(row.key);
    if (!el && row.key) el = document.querySelector('[name=' + JSON.stringify(row.key) + ']');
    if (el) el.value = row.value;
  });
}
function runScripts(root) {
  root.querySelectorAll('script').forEach(function (old) {
    var next = document.createElement('script');
    next.textContent = old.textContent;
    old.replaceWith(next);
  });
}
function paintLive(html) {
  var kept = snapshotFields();
  var parsed = new DOMParser().parseFromString(html, 'text/html');
  var slot = document.getElementById('live-root');
  if (!slot) {
    slot = document.createElement('div');
    slot.id = 'live-root';
    document.body.appendChild(slot);
  }
  document.querySelectorAll('#live-style, style[data-live-style]').forEach(function (oldStyle) {
    oldStyle.remove();
  });
  parsed.querySelectorAll('style').forEach(function (node, idx) {
    var copy = document.createElement('style');
    if (idx === 0) copy.id = 'live-style';
    copy.setAttribute('data-live-style', '1');
    copy.textContent = node.textContent;
    document.head.appendChild(copy);
  });
  slot.replaceChildren();
  parsed.head.querySelectorAll('script').forEach(function (node) {
    if (/PORT_READY|sessionNonce/.test(node.textContent || '')) return;
    slot.appendChild(document.importNode(node, true));
  });
  Array.prototype.slice.call(parsed.body.childNodes).forEach(function (node) {
    if (node.nodeName === 'SCRIPT' && /PORT_READY|sessionNonce/.test(node.textContent || '')) return;
    slot.appendChild(document.importNode(node, true));
  });
  restoreFields(kept);
  runScripts(slot);
}
</script>
</body>
</html>
