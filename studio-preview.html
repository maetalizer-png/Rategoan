<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data: blob:;">
</head>
<body>
<script>
var host = '';
var nonce = '';
try {
  var params = new URLSearchParams(location.search);
  host = params.get('host') || '';
  nonce = params.get('nonce') || '';
} catch (e) { host = ''; }
window.addEventListener('message', function (event) {
  if (event.source !== window.parent) return;
  if (!host || event.origin !== host) return;
  var data = event.data;
  if (!data || data.type !== 'INIT_PORT' || !event.ports || !event.ports[0]) return;
  if (!nonce || data.nonce !== nonce) return;
  var port = event.ports[0];
  port.onmessage = function (e) {
    var msg = e.data || {};
    if (msg.type !== 'RENDER_PAYLOAD' || typeof msg.html !== 'string') return;
    if (msg.nonce !== nonce) return;
    document.open();
    document.write(msg.html);
    document.close();
  };
  port.postMessage({ type: 'PORT_READY' });
});
</script>
</body>
</html>
