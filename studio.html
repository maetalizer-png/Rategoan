<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#fafaf8">
  <title>Studio Kode — Rategoan</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self' blob: https://api.github.com; worker-src 'self' blob:; frame-src 'self' blob:; object-src 'none';">
  <script src="js/boot-theme.js"></script>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/ui/studio.css">
</head>
<body class="studio-page">
  <div id="studio-app" class="studio-app">
    <header id="topbar">
      <a class="menu-circle" href="index.html#/chat" aria-label="Kembali ke Chat">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      </a>
      <h1 id="header-model-name" class="header-model-name">Studio Kode</h1>
      <span class="row-spacer"></span>
      <div class="topbar-actions">
        <button type="button" id="btn-studio-history" class="icon-btn plain" aria-label="Riwayat sesi">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14"/></svg>
        </button>
        <button type="button" id="btn-studio-folder" class="icon-btn plain" aria-label="Buka Folder">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h6l2 2h10v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        </button>
        <button type="button" id="btn-studio-export" class="icon-btn plain" aria-label="Unduh ZIP">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><polyline points="7 11 12 16 17 11"/><path d="M5 21h14"/></svg>
        </button>
        <button type="button" id="btn-studio-push" class="icon-btn plain" aria-label="Terbitkan">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21V9"/><polyline points="7 13 12 8 17 13"/><path d="M5 3h14"/></svg>
        </button>
        <input type="file" id="studio-open-zip" accept=".zip,application/zip" hidden>
      </div>
    </header>
    <div class="studio-body">
      <main class="studio-chat-col">
        <div id="empty-state" class="empty-state">
          <div class="empty-brand">Rategoan</div>
        </div>
        <div id="messages"></div>
        <footer id="composer">
          <div id="studio-plus-sheet" hidden>
            <button type="button" data-studio-ask="Rancang scaffold arsitektur komponen dan state">Scaffold Arsitektur &amp; State</button>
            <button type="button" data-studio-ask="Audit keamanan dan celah CSP">Audit Keamanan &amp; CSP</button>
            <button type="button" data-studio-ask="Buatkan dashboard analitik real-time">Dashboard Analitik Real-time</button>
            <button type="button" data-studio-ask="Buatkan generator unit test">Generator Unit Test</button>
          </div>
          <div id="composer-card">
            <textarea id="chat-input" rows="1" placeholder="Tanya Rategoan" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" data-gramm="false" data-enable-grammarly="false"></textarea>
            <div class="card-row">
              <button id="btn-plus" class="icon-btn" type="button" aria-label="Opsi Studio">
                <svg width="20" height="20" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              </button>
              <span class="row-spacer"></span>
              <button id="studio-voice-btn" class="icon-btn" type="button" aria-label="Suara">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/></svg>
              </button>
              <button id="btn-send" class="send-plain" type="button" aria-label="Kirim">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
              </button>
            </div>
          </div>
        </footer>
      </main>
      <aside id="studio-canvas-pane" class="studio-canvas-pane">
        <header class="canvas-head">
          <strong id="studio-project-name">Proyek</strong>
          <button type="button" id="studio-sheet-close" aria-label="Tutup kanvas">Tutup</button>
        </header>
        <nav class="canvas-tabs">
          <button type="button" class="tab-btn active" data-tab="preview">Pratinjau Hidup</button>
          <button type="button" class="tab-btn" data-tab="files">Pohon Berkas</button>
          <button type="button" class="tab-btn" data-tab="logs">Konsol Log</button>
        </nav>
        <div class="canvas-content">
          <div id="tab-preview" class="tab-panel active">
            <iframe id="studio-preview-frame" sandbox="allow-scripts" title="Pratinjau hidup"></iframe>
          </div>
          <div id="tab-files" class="tab-panel">
            <div class="vfs-tree" id="vfs-tree"></div>
            <pre class="code-editor" id="code-editor" spellcheck="false"></pre>
          </div>
          <div id="tab-logs" class="tab-panel">
            <div class="console-output" id="console-output">Studio Kode siap. Tidak ada galat.</div>
          </div>
        </div>
      </aside>
    </div>
    <aside id="studio-history" aria-label="Riwayat sesi"></aside>
  </div>
  <script type="module" src="js/studio/studio-app.js"></script>
</body>
</html>
