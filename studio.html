<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#fafaf8">
  <title>Studio Kode — Rategoan</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self' blob: https://api.github.com; worker-src 'self' blob:; frame-src 'self' blob:; object-src 'none';">
  <script src="js/boot-theme.js"></script>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/ui/studio.css">
</head>
<body class="studio-page">
  <div id="studio-app" class="studio-app">
    <aside id="studio-sidebar" class="studio-sidebar-col">
      <div class="sidebar-header">
        <a class="icon-btn" href="index.html#/chat" aria-label="Kembali ke Chat">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        </a>
        <span class="sidebar-title">Proyek Kode</span>
        <button type="button" id="btn-new-project" class="icon-btn" aria-label="Proyek baru">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
      </div>
      <div id="studio-history" class="project-list" aria-label="Riwayat proyek"></div>
    </aside>
    <main class="studio-chat-col">
      <header id="topbar" class="studio-topbar">
        <a class="icon-btn mobile-back" href="index.html#/chat" aria-label="Kembali ke Chat">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        </a>
        <button type="button" id="btn-studio-history" class="icon-btn" aria-label="Daftar proyek">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="14" y2="17"/></svg>
        </button>
        <div class="topbar-title-group">
          <h1 id="header-model-name" class="header-model-name">Studio Kode</h1>
          <span class="topbar-subtitle">Mitra Rekayasa Agentik</span>
        </div>
        <span class="row-spacer"></span>
        <button type="button" id="btn-toggle-canvas" class="icon-btn" aria-label="Beralih kanvas">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="14" y1="4" x2="14" y2="20"/></svg>
        </button>
      </header>
      <div id="studio-content-area" class="studio-content-area">
        <div id="empty-state" class="studio-empty-state">
          <h2 class="studio-welcome-title">Studio Kode</h2>
          <p class="studio-welcome-sub">Lingkungan rekayasa perangkat lunak mandiri dan eksekusi luring.</p>
          <div class="inspiration-cards">
            <button type="button" class="insp-card" data-spec="Rancang scaffold arsitektur komponen dan state">Scaffold arsitektur</button>
            <button type="button" class="insp-card" data-spec="Audit keamanan dan celah CSP">Audit keamanan</button>
            <button type="button" class="insp-card" data-spec="Buatkan dashboard analitik real-time">Dashboard analitik</button>
            <button type="button" class="insp-card" data-spec="Buatkan generator unit test">Uji satuan</button>
          </div>
        </div>
        <div id="messages"></div>
        <footer id="composer">
          <div id="studio-plus-sheet" hidden>
            <button type="button" id="btn-studio-folder">Buka Folder</button>
            <button type="button" id="btn-studio-zip">Buka ZIP</button>
            <button type="button" id="btn-studio-export">Unduh ZIP</button>
            <button type="button" id="btn-studio-push">Terbitkan</button>
            <button type="button" id="studio-voice-btn">Dikte</button>
            <input type="file" id="studio-open-zip" accept=".zip,application/zip" hidden>
          </div>
          <div id="composer-card">
            <div class="card-row">
              <button id="btn-plus" class="icon-btn" type="button" aria-label="Hubungkan konektor">
                <svg width="20" height="20" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              </button>
              <textarea id="chat-input" rows="1" placeholder="Tanya Studio Kode…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" data-gramm="false" data-enable-grammarly="false"></textarea>
              <button id="btn-send" class="send-plain" type="button" aria-label="Kirim">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
              </button>
            </div>
          </div>
        </footer>
      </div>
    </main>
    <aside id="studio-canvas-pane" class="studio-canvas-pane">
      <header class="canvas-head">
        <strong id="studio-project-name">Proyek</strong>
        <button type="button" id="studio-sheet-close" aria-label="Tutup kanvas">Tutup</button>
      </header>
      <nav class="canvas-tabs">
        <button type="button" class="tab-btn active" data-tab="preview">Pratinjau Hidup</button>
        <button type="button" class="tab-btn" data-tab="files">Pohon Berkas</button>
        <button type="button" class="tab-btn" data-tab="logs">Konsol Log</button>
      </nav>
      <div class="canvas-content">
        <div id="tab-preview" class="tab-panel active">
          <iframe id="studio-preview-frame" sandbox="allow-scripts" title="Pratinjau hidup"></iframe>
        </div>
        <div id="tab-files" class="tab-panel">
          <div class="vfs-tree" id="vfs-tree"></div>
          <pre class="code-editor" id="code-editor" spellcheck="false"></pre>
        </div>
        <div id="tab-logs" class="tab-panel">
          <div class="console-output" id="console-output">Studio Kode siap. Tidak ada galat.</div>
        </div>
      </div>
    </aside>
  </div>
  <script type="module" src="js/studio/studio-app.js"></script>
</body>
</html>
