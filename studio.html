<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#05080c">
  <title>Studio Kode</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self' blob: https://api.github.com; worker-src 'self' blob:; frame-src 'self' blob:; object-src 'none';">
  <script src="js/boot-theme.js"></script>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/ui/thought.css">
  <link rel="stylesheet" href="css/ui/studio.css">
</head>
<body>
  <div id="studio-app" class="studio-shell">
    <header id="studio-topbar" class="studio-topbar">
      <div class="topbar-left">
        <a class="btn-back" href="index.html#/chat">Kembali ke Chat</a>
        <h1 class="studio-title">Studio Kode</h1>
      </div>
      <div class="topbar-actions">
        <button type="button" id="btn-studio-folder" class="btn-studio-ghost">Buka Folder</button>
        <button type="button" id="btn-studio-export" class="btn-studio-ghost">Unduh ZIP</button>
        <button type="button" id="btn-studio-push" class="btn-studio-accent">Terbitkan</button>
        <input type="file" id="studio-open-zip" accept=".zip,application/zip" hidden>
      </div>
    </header>
    <div class="studio-workspace">
      <aside id="studio-history"></aside>
      <main class="studio-layout">
        <section id="studio-chat-pane" class="studio-chat-pane">
          <div id="studio-landing">
            <h2>Studio Kode</h2>
            <p>Mitra rekayasa mandiri Anda. Merakit arsitektur komponen, audit keamanan, analitik real-time, dan otomasi unit test.</p>
          </div>
          <div id="studio-messages" class="studio-messages"></div>
          <div class="studio-presets" id="studio-presets">
            <button type="button" data-studio-ask="Rancang scaffold arsitektur komponen dan state">Scaffold Arsitektur & State</button>
            <button type="button" data-studio-ask="Audit keamanan dan celah CSP">Audit Keamanan & CSP</button>
            <button type="button" data-studio-ask="Buatkan dashboard analitik real-time">Dashboard Analitik Real-time</button>
            <button type="button" data-studio-ask="Buatkan generator unit test">Generator Unit Test</button>
          </div>
          <footer id="studio-composer" class="studio-composer">
            <textarea id="studio-input" rows="3" placeholder="Ketik spesifikasi rekayasa, arsitektur sistem, atau instruksi koding Anda di sini…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>
            <button type="button" id="studio-voice-btn" class="btn-icon">Dikte</button>
            <button type="button" id="studio-send-btn" class="btn-primary">Kirim</button>
          </footer>
        </section>
        <section id="studio-canvas-pane" class="studio-canvas-pane">
          <header class="canvas-head">
            <strong id="studio-project-name">Proyek</strong>
            <button type="button" id="studio-sheet-close">Tutup</button>
          </header>
          <nav class="canvas-tabs">
            <button type="button" class="tab-btn active" data-tab="preview">Pratinjau Hidup</button>
            <button type="button" class="tab-btn" data-tab="files">Pohon Berkas</button>
            <button type="button" class="tab-btn" data-tab="logs">Konsol Log</button>
          </nav>
          <div class="canvas-content">
            <div id="tab-preview" class="tab-panel active">
              <iframe id="studio-preview-frame" sandbox="allow-scripts" title="Pratinjau hidup"></iframe>
            </div>
            <div id="tab-files" class="tab-panel">
              <div class="vfs-tree" id="vfs-tree"></div>
              <pre class="code-editor" id="code-editor" spellcheck="false"></pre>
            </div>
            <div id="tab-logs" class="tab-panel">
              <div class="console-output" id="console-output">Studio Kode siap. Tidak ada galat.</div>
            </div>
          </div>
        </section>
      </main>
    </div>
  </div>
  <script type="module" src="js/studio/studio-app.js"></script>
</body>
</html>
