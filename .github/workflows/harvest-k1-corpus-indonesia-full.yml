name: harvest-k1-corpus-indonesia-full

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  harvest:
    if: contains(github.event.head_commit.message, '[harvest-k1-corpus-full]')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Download all HF Parquet shards and upload to existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="maetalizer-png/Rategoan"
          TAG="data-baru-k1-corpus-indonesia-2026-09"
          BASE="https://huggingface.co/datasets/Lyon28/Corpus-Indonesia/resolve/refs%2Fconvert%2Fparquet/default/train"
          mkdir -p work
          gh release view "$TAG" --repo "$REPO" >/dev/null
          for i in 0000 0001 0002 0003 0004 0005 0006; do
            out="work/corpus-indonesia-${i}.parquet"
            url="$BASE/${i}.parquet?download=true"
            echo "Downloading $url"
            curl -L --fail --retry 8 --retry-all-errors --connect-timeout 30 -o "$out" "$url"
            test -s "$out"
            bytes=$(stat -c%s "$out")
            sha=$(sha256sum "$out" | awk '{print $1}')
            printf '{"source":"Lyon28/Corpus-Indonesia","source_path":"refs/convert/parquet/default/train/%s.parquet","bytes":%s,"sha256":"%s","license":"Apache-2.0"}\n' "$i" "$bytes" "$sha" > "work/corpus-indonesia-${i}.manifest.json"
            gh release upload "$TAG" --repo "$REPO" "$out" "work/corpus-indonesia-${i}.manifest.json" --clobber
            rm -f "$out" "work/corpus-indonesia-${i}.manifest.json"
          done
          gh release view "$TAG" --repo "$REPO"
          echo "FULL HARVEST COMPLETED: 7 Parquet shards uploaded."