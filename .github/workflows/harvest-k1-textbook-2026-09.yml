name: harvest-k1-textbook-2026-09

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  harvest:
    if: contains(github.event.head_commit.message, '[harvest-k1-textbook]')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Harvest large Indonesian textbook datasets into existing K1 release
        env:
          GH_TOKEN: ${{ github.token }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          REPO="maetalizer-png/Rategoan"
          TAG="data-baru-k1-corpus-indonesia-2026-09"
          mkdir -p work
          gh release view "$TAG" --repo "$REPO" >/dev/null
          test -n "${HF_TOKEN:-}" || { echo "HF_TOKEN GitHub secret is not configured; cannot access gated textbook datasets."; exit 2; }
          python -m pip install -q huggingface_hub

          python - <<'PY'
          import os, json
          from huggingface_hub import HfApi
          api=HfApi(token=os.environ['HF_TOKEN'])
          repos=[
            ('InfoBayAI/Indonesian-STEM-Textbook-Dataset','cc-by-4.0'),
            ('InfoBayAI/Indonesian-Non-STEM-Textbook-Dataset','cc-by-4.0')
          ]
          allf=[]
          for repo,lic in repos:
              info=api.dataset_info(repo)
              print('DATASET',repo,'gated=',getattr(info,'gated',None),'sha=',info.sha)
              for x in api.list_repo_tree(repo, recursive=True, expand=False):
                  p=getattr(x,'path','')
                  if getattr(x,'type',None)=='file' and p.lower().endswith(('.parquet','.jsonl','.jsonl.gz','.csv','.csv.gz')):
                      size=int(getattr(x,'size',0) or 0)
                      allf.append({'repo':repo,'license':lic,'path':p,'size':size})
          if not allf: raise SystemExit('No textbook data files accessible with the configured HF token')
          with open('work/textbook-files.json','w') as f: json.dump({'sources':allf},f,indent=2)
          print('TOTAL_FILES',len(allf),'TOTAL_BYTES',sum(x['size'] for x in allf))
          PY

          n=0
          python - <<'PY'
          import os, json
          from huggingface_hub import hf_hub_download
          d=json.load(open('work/textbook-files.json'))
          for x in d['sources']:
              n=sum(1 for _ in open('work/downloaded.tsv')) if os.path.exists('work/downloaded.tsv') else 0
              n += 1
              local=hf_hub_download(repo_id=x['repo'], filename=x['path'], repo_type='dataset', token=os.environ['HF_TOKEN'], local_dir='work/hf')
              out=f"work/{n:04d}-" + x['path'].replace('/','__')
              os.replace(local,out)
              import hashlib
              h=hashlib.sha256()
              with open(out,'rb') as rf:
                  for chunk in iter(lambda: rf.read(1024*1024),b''): h.update(chunk)
              x['downloaded']=out
              x['bytes']=os.path.getsize(out)
              x['sha256']=h.hexdigest()
              with open('work/downloaded.tsv','a') as lf: lf.write(f"{x['repo']}\t{x['license']}\t{x['path']}\t{x['bytes']}\t{x['sha256']}\n")
          with open('work/textbook-manifest.json','w') as f: json.dump({'sources':d['sources']},f,indent=2)
          PY

          while IFS=$'\t' read -r repo license path bytes sha; do
            base=$(basename "$path")
            safe=$(printf '%s' "$base" | tr '/ ' '__')
            out=$(find work -maxdepth 1 -type f -name "*-""$safe" | head -1)
            [ -n "$out" ] || { echo "missing local file for $path"; exit 3; }
            if [ "$bytes" -gt 1900000000 ]; then
              split -b 1800M -d -a 3 "$out" "${out}.part-"
              for p in "${out}.part-"*; do gh release upload "$TAG" --repo "$REPO" "$p" --clobber; done
            else
              gh release upload "$TAG" --repo "$REPO" "$out" --clobber
            fi
          done < work/downloaded.tsv

          gh release upload "$TAG" --repo "$REPO" work/textbook-manifest.json work/textbook-files.json work/downloaded.tsv --clobber
          echo "LARGE INDONESIAN TEXTBOOK HARVEST COMPLETE"
