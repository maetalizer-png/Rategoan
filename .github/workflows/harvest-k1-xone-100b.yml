name: Harvest large K1 Xone 100B into existing release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/harvest-k1-xone-100b.yml"

permissions:
  contents: write

jobs:
  harvest:
    if: contains(github.event.head_commit.message, '[harvest-k1-xone-100b]')
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Harvest Xone 100B in release-safe batches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          REPO="maetalizer-png/Rategoan"
          TAG="data-baru-k1-corpus-indonesia-2026-09"
          HF_REPO="cloverxion/xone-llm-en-id-100b-pretraining-dataset"
          mkdir -p work

          gh release view "$TAG" --repo "$REPO" >/dev/null

          python - <<'PY'
          import json, urllib.request
          api="https://huggingface.co/api/datasets/cloverxion/xone-llm-en-id-100b-pretraining-dataset/tree/main?recursive=true&expand=false"
          with urllib.request.urlopen(api, timeout=120) as r:
              items=json.load(r)
          files=[]
          for x in items:
              p=x.get("path","")
              s=int(x.get("size") or 0)
              if x.get("type")=="file" and s>0 and p.lower().endswith((".bin",".bin.gz",".safetensors",".parquet",".jsonl",".jsonl.gz")):
                  files.append((p,s))
          files.sort()
          if not files:
              raise SystemExit("No Xone data shards found")
          total=sum(s for _,s in files)
          with open("work/xone-files.tsv","w") as f:
              for p,s in files:
                  f.write(f"{p}\t{s}\n")
          with open("work/xone-manifest.json","w") as f:
              json.dump({
                  "source": HF_REPO,
                  "license": "Apache-2.0",
                  "file_count": len(files),
                  "total_source_bytes": total,
                  "total_source_gb_decimal": total/1e9
              }, f, indent=2)
          print("XONE_FILES", len(files))
          print("XONE_SOURCE_BYTES", total)
          print("XONE_SOURCE_GB_DECIMAL", total/1e9)
          PY

          gh release upload "$TAG" --repo "$REPO" work/xone-manifest.json --clobber

          batch=0
          n=0
          mkdir -p work/batch
          while IFS=$'\t' read -r path size; do
            [ -z "$path" ] && continue
            safe=$(printf '%s' "$path" | sed 's#[ /]#_#g')
            curl -L --fail --retry 8 --retry-all-errors -o "work/batch/$safe" "https://huggingface.co/datasets/$HF_REPO/resolve/main/$path?download=true"
            test -s "work/batch/$safe"
            n=$((n+1))

            if [ "$n" -ge 8 ]; then
              archive="work/xone-100b-batch-$(printf '%04d' "$batch").tar.gz"
              tar -czf "$archive" -C work/batch .
              bytes=$(stat -c%s "$archive")
              echo "Uploading $archive ($bytes bytes)"
              gh release upload "$TAG" --repo "$REPO" "$archive" --clobber
              rm -rf work/batch/*
              batch=$((batch+1))
              n=0
            fi
          done < work/xone-files.tsv

          if [ "$n" -gt 0 ]; then
            archive="work/xone-100b-batch-$(printf '%04d' "$batch").tar.gz"
            tar -czf "$archive" -C work/batch .
            bytes=$(stat -c%s "$archive")
            echo "Uploading $archive ($bytes bytes)"
            gh release upload "$TAG" --repo "$REPO" "$archive" --clobber
          fi

          echo "Xone 100B harvest batches uploaded to existing release."
