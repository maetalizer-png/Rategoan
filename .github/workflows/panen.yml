name: panen

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Dataset (SEMUA atau salah satu slug)'
        required: false
        default: 'SEMUA'
        type: choice
        options:
          - SEMUA
          - madlad400-id
          - oscar-id
          - wikipedia-id
      maks_menit_lumbung_utama:
        description: 'Anggaran menit khusus MADLAD-400 (lumbung utama)'
        required: false
        default: '180'
      maks_dokumen_lumbung_utama:
        description: 'Anggaran dokumen khusus MADLAD-400 (lumbung utama)'
        required: false
        default: '20000000'
      maks_menit:
        description: 'Anggaran menit per dataset lain (OSCAR/Wikipedia)'
        required: false
        default: '60'
      maks_dokumen:
        description: 'Anggaran dokumen per dataset lain (OSCAR/Wikipedia)'
        required: false
        default: '2000000'

permissions:
  contents: write

jobs:
  panen:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install datasets huggingface_hub requests
      - run: python -u tools/panen_hf.py
        env:
          PYTHONUNBUFFERED: '1'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RAGET_MODE_PANEN: ${{ github.event.inputs.mode }}
          RAGET_MAKS_MENIT_LUMBUNG_UTAMA: ${{ github.event.inputs.maks_menit_lumbung_utama }}
          RAGET_MAKS_DOKUMEN_LUMBUNG_UTAMA: ${{ github.event.inputs.maks_dokumen_lumbung_utama }}
          RAGET_MAKS_MENIT: ${{ github.event.inputs.maks_menit }}
          RAGET_MAKS_DOKUMEN: ${{ github.event.inputs.maks_dokumen }}
