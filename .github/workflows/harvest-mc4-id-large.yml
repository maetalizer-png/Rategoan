name: harvest-mc4-id-large

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: harvest-mc4-id-large
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Harvest 20GB+ mC4 Indonesian
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="maetalizer-png/Rategoan"
          TAG="data-baru-mc4-id-2026-09"
          mkdir -p work
          gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1 || gh release create "$TAG" --repo "$REPO" --title "Data Baru — mC4 Indonesian — 2026-09" --notes "Standalone large K1 candidate. Source: indonesian-nlp/mc4-id / original shard store. License ODC-By 1.0. Not placed in K1/K2/K3/K4."

          python - <<'PY'
          import pathlib
          n=220
          pathlib.Path("work/shards.txt").write_text("\n".join(str(i) for i in range(n))+"\n")
          print("selected shards",n)
          PY

          part=1
          bytes_out=0
          out="work/mc4-id-part-$part.jsonl.gz"
          python - "$out" <<'PY'
          import gzip,sys
          f=gzip.open(sys.argv[1],"wt",encoding="utf-8")
          f.close()
          PY

          while IFS= read -r idx; do
            src="work/shard-$idx.json.gz"
            url=$(printf 'https://huggingface.co/datasets/indonesian-nlp/mc4-id/resolve/main/mc4-id-filter/c4-id.tfrecord-%05d-of-01024.json.gz?download=true' "$idx")
            curl -L --fail --retry 6 --retry-all-errors -o "$src" "$url"

            python - "$src" "work/current.jsonl.gz" <<'PY'
          import sys,gzip,json,os
          src,out=sys.argv[1:]
          # Append decompressed JSONL records to the current gzip part.
          with gzip.open(src,"rt",encoding="utf-8",errors="replace") as inp, gzip.open(out,"at",encoding="utf-8") as f:
              for line in inp:
                  if line.strip():
                      f.write(line)
          PY

            rm -f "$src"

            size=$(stat -c%s "work/current.jsonl.gz")
            if [ "$size" -ge 1700000000 ]; then
              sha=$(sha256sum work/current.jsonl.gz|awk '{print $1}')
              mv work/current.jsonl.gz "work/mc4-id-part-$part.jsonl.gz"
              printf '{"dataset":"indonesian-nlp/mc4-id","part":%s,"bytes":%s,"sha256":"%s","license":"ODC-By-1.0"}\n' "$part" "$size" "$sha" > "work/mc4-id-part-$part.manifest.json"
              gh release upload "$TAG" --repo "$REPO" "work/mc4-id-part-$part.jsonl.gz" "work/mc4-id-part-$part.manifest.json" --clobber
              rm -f "work/mc4-id-part-$part.jsonl.gz" "work/mc4-id-part-$part.manifest.json"
              part=$((part+1))
              : > work/current.jsonl.gz
            fi
          done < work/shards.txt

          if [ -s work/current.jsonl.gz ]; then
            size=$(stat -c%s work/current.jsonl.gz)
            sha=$(sha256sum work/current.jsonl.gz|awk '{print $1}')
            mv work/current.jsonl.gz "work/mc4-id-part-$part.jsonl.gz"
            printf '{"dataset":"indonesian-nlp/mc4-id","part":%s,"bytes":%s,"sha256":"%s","license":"ODC-By-1.0"}\n' "$part" "$size" "$sha" > "work/mc4-id-part-$part.manifest.json"
            gh release upload "$TAG" --repo "$REPO" "work/mc4-id-part-$part.jsonl.gz" "work/mc4-id-part-$part.manifest.json" --clobber
          fi

          printf '{"dataset":"indonesian-nlp/mc4-id","shards_processed":220,"status":"harvested","license":"ODC-By-1.0"}\n' > work/manifest-total.json
          gh release upload "$TAG" --repo "$REPO" work/manifest-total.json --clobber
