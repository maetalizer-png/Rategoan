name: harvest-k1-textbooks

on:
  push:
    branches: [main]

concurrency:
  group: harvest-k1-textbooks
  cancel-in-progress: false

permissions:
  contents: write

env:
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  REPO: maetalizer-png/Rategoan
  TAG: data-baru-k1-corpus-indonesia-2026-09

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Install Hugging Face CLI
        run: python -m pip install -q -U huggingface_hub

      - name: Check HF access
        run: |
          set -euo pipefail
          test -n "$HF_TOKEN" || { echo 'HF_TOKEN GitHub secret is not configured'; exit 1; }
          hf auth whoami --token "$HF_TOKEN"

      - name: Download STEM textbook dataset
        run: |
          set -euo pipefail
          rm -rf work/stem
          mkdir -p work/stem
          hf download InfoBayAI/Indonesian-STEM-Textbook-Dataset --repo-type dataset --local-dir work/stem --token "$HF_TOKEN"
          du -sh work/stem

      - name: Download Non-STEM textbook dataset
        run: |
          set -euo pipefail
          rm -rf work/nonstem
          mkdir -p work/nonstem
          hf download InfoBayAI/Indonesian-Non-STEM-Textbook-Dataset --repo-type dataset --local-dir work/nonstem --token "$HF_TOKEN"
          du -sh work/nonstem

      - name: Package and split release assets
        run: |
          set -euo pipefail
          mkdir -p work/assets
          tar -C work/stem -czf work/assets/indonesian-stem-textbooks.tar.gz .
          tar -C work/nonstem -czf work/assets/indonesian-nonstem-textbooks.tar.gz .
          for f in work/assets/*.tar.gz; do
            base=$(basename "$f" .tar.gz)
            split -b 1800m -d -a 3 "$f" "work/assets/${base}.part-"
            rm -f "$f"
          done
          sha256sum work/assets/* > work/assets/SHA256SUMS
          ls -lh work/assets

      - name: Upload to existing data release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for f in work/assets/*; do
            gh release upload "$TAG" --repo "$REPO" "$f" --clobber
          done
          echo 'K1 textbook harvest uploaded to existing release.'

# trigger harvest run 2026-09-30-final-textbook-pass
