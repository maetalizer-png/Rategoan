name: Tag verified

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pindah:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          dari=26cd59f9ccb857e4a2c2e88f1e02d898eeb8625b
          br=tmp-verified
          gh api -X POST repos/$REPO/git/refs -f ref="refs/heads/$br" -f sha="$dari" >/dev/null
          content=$(printf 'Penanda commit bertanda tangan untuk tag rak K dan R.\n' | base64 -w0)
          new=$(gh api -X PUT repos/$REPO/contents/.github/VERIFIED.md -f message="Tandai rak K dan R" -f content="$content" -f branch="$br" --jq .commit.sha)
          ver=$(gh api repos/$REPO/commits/$new --jq .commit.verification.verified)
          echo "commit baru $new verified=$ver"
          if [ "$ver" = true ]; then
            for t in K-dataset-Indonesian R-dataset-english; do
              gh api -X PATCH repos/$REPO/git/refs/tags/$t -f sha="$new" -F force=true --jq '.ref + " -> " + .object.sha'
            done
          else
            echo "Tidak Verified, tag tidak dipindah."
          fi
          gh api -X DELETE repos/$REPO/git/refs/heads/$br && echo "cabang $br dihapus"
          [ "$ver" = true ]
