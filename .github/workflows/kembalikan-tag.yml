name: Kembalikan tag rilis

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  kembalikan:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          lama=26cd59f9ccb857e4a2c2e88f1e02d898eeb8625b
          for t in K-dataset-Indonesian R-dataset-english; do
            gh api -X PATCH repos/$REPO/git/refs/tags/$t -f sha="$lama" -F force=true --jq '.ref + " -> " + .object.sha'
          done
          gh api -X DELETE repos/$REPO/git/refs/heads/verifikasi-rak && echo "cabang verifikasi-rak dihapus"
