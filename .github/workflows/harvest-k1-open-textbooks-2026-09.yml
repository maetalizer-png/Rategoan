name: harvest-k1-open-textbooks-2026-09

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  harvest:
    if: contains(github.event.head_commit.message, '[harvest-k1-open-textbooks]')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Download 13.56 GB open textbook collection and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="maetalizer-png/Rategoan"
          TAG="data-baru-k1-corpus-indonesia-2026-09"
          HF_REPO="zabiullah/pdf-books-collection"
          mkdir -p work

          gh release view "$TAG" --repo "$REPO" >/dev/null

          python - <<'PY'
          import json, urllib.request
          repo='zabiullah/pdf-books-collection'
          api=f'https://huggingface.co/api/datasets/{repo}/tree/main?recursive=true&expand=false'
          with urllib.request.urlopen(api,timeout=120) as r: items=json.load(r)
          files=[]
          for x in items:
              p=x.get('path','')
              if x.get('type')=='file' and p.lower().endswith(('.pdf','.pdf.gz','.parquet','.json','.jsonl')):
                  size=int(x.get('size') or 0)
                  url=f'https://huggingface.co/datasets/{repo}/resolve/main/{p}?download=true'
                  files.append({'path':p,'size':size,'url':url})
          if not files: raise SystemExit('No textbook files found')
          with open('work/manifest.json','w') as f: json.dump({'source':repo,'license':'cc-by-4.0','files':files},f,indent=2)
          print('files=',len(files),'bytes=',sum(x['size'] for x in files))
          PY

          gh release upload "$TAG" --repo "$REPO" work/manifest.json --clobber

          python - <<'PY'
          import json
          d=json.load(open('work/manifest.json'))
          with open('work/file-list.tsv','w') as f:
              for i,x in enumerate(d['files'],1): f.write(f"{i}\t{x['size']}\t{x['path']}\t{x['url']}\n")
          PY

          n=0
          while IFS=$'\t' read -r idx size path url; do
            [ -z "$path" ] && continue
            n=$((n+1))
            safe=$(printf '%s' "$path" | tr '/ ' '__')
            out="work/${n}-${safe}"
            echo "Downloading $n: $path ($size bytes)"
            curl -L --fail --retry 8 --retry-all-errors --connect-timeout 30 -o "$out" "$url"
            test -s "$out"
            bytes=$(stat -c%s "$out")
            if [ "$bytes" -gt 1900000000 ]; then
              split -b 1900M -d -a 3 "$out" "${out}.part-"
              for p in "${out}.part-"*; do gh release upload "$TAG" --repo "$REPO" "$p" --clobber; done
              rm -f "$out" "${out}.part-"*
            else
              gh release upload "$TAG" --repo "$REPO" "$out" --clobber
              rm -f "$out"
            fi
          done < work/file-list.tsv

          gh release upload "$TAG" --repo "$REPO" work/file-list.tsv --clobber
          echo "K1 OPEN TEXTBOOK HARVEST COMPLETE"

# use existing K1 candidate release; no new tag

# rerun harvest 2026-09-30: publish all discovered textbook files into existing K1 candidate release
