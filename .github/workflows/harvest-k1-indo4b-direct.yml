name: harvest-k1-indo4b-direct
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  harvest:
    if: contains(github.event.head_commit.message, '[harvest-indo4b-direct]')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Download and upload Indo4B deep-clean corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          HF_REPO="img-gemina/indonesian-corpus-2b-deepclean-indo4b"
          UPLOAD_URL="https://uploads.github.com/repos/maetalizer-png/Rategoan/releases/398761150/assets"
          mkdir -p work
          python - <<'PY'
          import json, urllib.request
          repo="img-gemina/indonesian-corpus-2b-deepclean-indo4b"
          api=f"https://huggingface.co/api/datasets/{repo}/tree/main?recursive=true&expand=false"
          with urllib.request.urlopen(api, timeout=120) as r:
              items=json.load(r)
          files=[(x.get("path",""), int(x.get("size") or 0)) for x in items if x.get("type")=="file" and x.get("path","").endswith(".jsonl.gz")]
          if len(files)!=1:
              raise SystemExit(f"Expected exactly one jsonl.gz, found {files}")
          p,s=files[0]
          json.dump({"source":repo,"path":p,"bytes":s,"license":"CC-BY-4.0"},open("work/source.json","w"),indent=2)
          print("SOURCE",p,s)
          PY
          PATH_IN_HF=$(python -c 'import json; print(json.load(open("work/source.json"))["path"])')
          EXPECTED=$(python -c 'import json; print(json.load(open("work/source.json"))["bytes"])')
          curl -L --fail --retry 6 --retry-all-errors -o work/corpus.jsonl.gz "https://huggingface.co/datasets/$HF_REPO/resolve/main/$PATH_IN_HF?download=true"
          ACTUAL=$(stat -c%s work/corpus.jsonl.gz)
          test "$ACTUAL" -eq "$EXPECTED"
          sha256sum work/corpus.jsonl.gz > work/full.sha256
          split -b 1800m -d -a 2 work/corpus.jsonl.gz work/indo4b.part.
          i=0
          for f in work/indo4b.part.*; do
            name="indo4b-deepclean-2026-09.part-${i}.jsonl.gz"
            curl --fail --retry 5 --retry-all-errors -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/octet-stream" --data-binary "@$f" "$UPLOAD_URL?name=$name"
            i=$((i+1))
          done
          python - <<'PY'
          import json,glob,os,hashlib
          m=json.load(open("work/source.json"))
          m["uploaded_parts"]=[]
          for f in sorted(glob.glob("work/indo4b.part.*")):
              m["uploaded_parts"].append({"file":os.path.basename(f),"bytes":os.path.getsize(f),"sha256":hashlib.sha256(open(f,"rb").read()).hexdigest()})
          m["full_sha256"]=open("work/full.sha256").read().split()[0]
          m["status"]="complete"
          json.dump(m,open("work/manifest-final.json","w"),indent=2)
          PY
          curl --fail --retry 5 --retry-all-errors -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/json" --data-binary "@work/manifest-final.json" "$UPLOAD_URL?name=indo4b-deepclean-2026-09.manifest.json"
          echo "HARVEST_COMPLETE $HF_REPO bytes=$ACTUAL parts=$i"
