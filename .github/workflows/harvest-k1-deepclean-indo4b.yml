name: harvest-k1-deepclean-indo4b

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Download DeepClean Indo4B from Hugging Face
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="maetalizer-png/Rategoan"
          TAG="penampung"
          URL="https://huggingface.co/datasets/img-gemina/indonesian-corpus-2b-deepclean-indo4b/resolve/main/indonesian_corpus_1p8b_deepclean_indo4b.jsonl.gz?download=true"
          mkdir -p work
          gh release view "$TAG" --repo "$REPO" >/dev/null
          curl -L --fail --retry 8 --retry-all-errors -C - -o work/indo4b.jsonl.gz "$URL"
          test -s work/indo4b.jsonl.gz
          sha256sum work/indo4b.jsonl.gz > work/indo4b.jsonl.gz.sha256
          stat -c '%s bytes' work/indo4b.jsonl.gz

      - name: Split and upload into existing penampung release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="maetalizer-png/Rategoan"
          TAG="penampung"
          cd work
          split -b 1800M -d -a 2 indo4b.jsonl.gz indo4b.part.
          cat > manifest-indo4b.txt <<'EOF'
Source: img-gemina/indonesian-corpus-2b-deepclean-indo4b
Artifact: indonesian_corpus_1p8b_deepclean_indo4b.jsonl.gz
Tokens: 1,801,814,049
Documents: 25,553,595
Source size: ~4.76 GB
License: CC-BY-4.0
Reassembly: cat indo4b.part.* > indonesian_corpus_1p8b_deepclean_indo4b.jsonl.gz
SHA256: see indo4b.jsonl.gz.sha256
EOF
          gh release upload "$TAG" --repo "$REPO" indo4b.part.* indo4b.jsonl.gz.sha256 manifest-indo4b.txt --clobber
          echo "DeepClean Indo4B uploaded to penampung."
