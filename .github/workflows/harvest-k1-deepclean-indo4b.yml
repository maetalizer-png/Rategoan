name: harvest-k1-deepclean-indo4b

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  harvest:
    if: contains(github.event.head_commit.message, '[harvest-k1-indo4b]')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Download DeepClean Indo4B from Hugging Face
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="maetalizer-png/Rategoan"
          TAG="data-baru-k1-indo4b-deepclean-2026-09"
          URL="https://huggingface.co/datasets/img-gemina/indonesian-corpus-2b-deepclean-indo4b/resolve/main/indonesian_corpus_1p8b_deepclean_indo4b.jsonl.gz?download=true"
          mkdir -p work
          gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1 || gh release create "$TAG" --repo "$REPO" --title "Data Baru K1 — Indo4B DeepClean 1.8B — 2026-09" --notes "Standalone K1 candidate. Source: img-gemina/indonesian-corpus-2b-deepclean-indo4b on Hugging Face. Published artifact: 1,801,814,049 tokens; 25,553,595 docs; CC-BY-4.0. Split into release assets because the source artifact is ~4.76 GB and GitHub release assets have a 2 GB per-file limit."
          curl -L --fail --retry 8 --retry-all-errors -C - -o work/indo4b.jsonl.gz "$URL"
          test -s work/indo4b.jsonl.gz
          sha256sum work/indo4b.jsonl.gz > work/indo4b.jsonl.gz.sha256
          stat -c '%s bytes' work/indo4b.jsonl.gz

      - name: Split into release-sized assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="maetalizer-png/Rategoan"
          TAG="data-baru-k1-indo4b-deepclean-2026-09"
          cd work
          split -b 1800M -d -a 2 indo4b.jsonl.gz indo4b.part.
          cat > manifest.txt <<'EOF'
Source: https://huggingface.co/datasets/img-gemina/indonesian-corpus-2b-deepclean-indo4b
Artifact: indonesian_corpus_1p8b_deepclean_indo4b.jsonl.gz
Tokens: 1,801,814,049
Documents: 25,553,595
Source size: 4.76 GB
License: CC-BY-4.0
Reassembly: cat indo4b.part.* > indonesian_corpus_1p8b_deepclean_indo4b.jsonl.gz
SHA256 is in indo4b.jsonl.gz.sha256
EOF
          gh release upload "$TAG" --repo "$REPO" indo4b.part.* indo4b.jsonl.gz.sha256 manifest.txt --clobber
