name: harvest-k1-infobay-textbooks

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: harvest-k1-infobay-textbooks
  cancel-in-progress: false

jobs:
  harvest:
    if: contains(github.event.head_commit.message, '[harvest-infobay-textbooks]')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      REPO: maetalizer-png/Rategoan
      TAG: data-baru-k1-textbooks-2026-09

    steps:
      - name: Install Hugging Face Hub
        run: python -m pip install -q -U huggingface_hub

      - name: Verify gated HF access
        run: |
          set -euo pipefail
          test -n "$HF_TOKEN"
          hf auth whoami --token "$HF_TOKEN"
          gh release view "$TAG" --repo "$REPO" >/dev/null

      - name: Enumerate and download all textbook data files
        run: |
          set -euo pipefail
          mkdir -p work
          python - <<'PY'
          import os, json, hashlib
          from huggingface_hub import HfApi, hf_hub_download
          token=os.environ["HF_TOKEN"]
          api=HfApi(token=token)
          repos=[
            ("InfoBayAI/Indonesian-STEM-Textbook-Dataset","stem"),
            ("InfoBayAI/Indonesian-Non-STEM-Textbook-Dataset","nonstem"),
          ]
          manifest=[]
          for repo,label in repos:
            info=api.dataset_info(repo)
            print("DATASET",repo,"gated=",getattr(info,"gated",None),"sha=",info.sha)
            files=[]
            for x in api.list_repo_tree(repo,recursive=True,expand=False):
              p=getattr(x,"path","")
              if getattr(x,"type",None)=="file" and p.lower().endswith((".parquet",".jsonl",".jsonl.gz",".csv",".csv.gz")):
                files.append((p,int(getattr(x,"size",0) or 0)))
            if not files:
              raise SystemExit(f"No data files accessible for {repo}")
            print("FILES",repo,len(files),"BYTES",sum(s for _,s in files))
            for idx,(p,declared) in enumerate(sorted(files),1):
              local=hf_hub_download(repo_id=repo,filename=p,repo_type="dataset",token=token,local_dir=f"work/{label}")
              actual=os.path.getsize(local)
              if actual<=0: raise SystemExit(f"Empty download: {repo}:{p}")
              h=hashlib.sha256()
              with open(local,"rb") as f:
                for chunk in iter(lambda:f.read(8*1024*1024),b""): h.update(chunk)
              out=f"work/{label}-{idx:04d}-"+p.replace("/","__")
              os.replace(local,out)
              manifest.append({"source":repo,"label":label,"path":p,"declared_bytes":declared,"bytes":actual,"sha256":h.hexdigest(),"local":out,"license":"cc-by-4.0"})
          json.dump({"sources":manifest},open("work/infobay-textbooks-manifest.json","w"),indent=2)
          print("TOTAL_FILES",len(manifest))
          print("TOTAL_BYTES",sum(x["bytes"] for x in manifest))
          PY

      - name: Upload every downloaded file into the existing K1 textbook release
        run: |
          set -euo pipefail
          while IFS= read -r f; do
            [ -s "$f" ] || { echo "Missing/empty $f"; exit 2; }
            base=$(basename "$f")
            bytes=$(stat -c%s "$f")
            if [ "$bytes" -gt 1900000000 ]; then
              split -b 1800M -d -a 3 "$f" "work/$base.part-"
              for p in "work/$base.part-"*; do
                gh release upload "$TAG" --repo "$REPO" "$p" --clobber
              done
            else
              gh release upload "$TAG" --repo "$REPO" "$f" --clobber
            fi
          done < <(python - <<'PY'
          import json
          for x in json.load(open("work/infobay-textbooks-manifest.json"))["sources"]:
            print(x["local"])
          PY
          )
          gh release upload "$TAG" --repo "$REPO" work/infobay-textbooks-manifest.json --clobber
          echo "INFOBAY textbook harvest uploaded to existing tag."
