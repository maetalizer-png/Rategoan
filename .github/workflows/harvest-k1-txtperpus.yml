name: harvest-k1-txtperpus

on:
  push:
    branches: [main]

concurrency:
  group: harvest-k1-txtperpus
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  harvest:
    if: contains(github.event.head_commit.message, '[harvest-k1-txtperpus]')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Harvest TXTperpus Indonesian academic corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="maetalizer-png/Rategoan"
          TAG="data-baru-k1-txtperpus-2026-09"
          RECORD="16024158"
          mkdir -p work

          gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1 || gh release create "$TAG" --repo "$REPO" \
            --title "Data Baru K1 — TXTperpus — 2026-09" \
            --notes "Standalone K1 candidate. Source: TXTperpus: textual data of Indonesian LIS journal articles, Zenodo record 16024158. Open Access source; academic Indonesian full-text corpus. Kept outside canonical K1 until cleaning/deduplication and overlap/license audit."

          python - <<'PY'
          import json, urllib.request
          url="https://zenodo.org/api/records/16024158"
          with urllib.request.urlopen(url, timeout=120) as r:
              rec=json.load(r)
          files=[]
          for f in rec.get("files", []):
              key=f.get("key") or f.get("filename") or ""
              links=f.get("links") or {}
              download=links.get("self") or links.get("download")
              size=int(f.get("size") or 0)
              if key and download:
                  files.append((key,size,download))
          if not files:
              raise SystemExit("No downloadable files found in Zenodo record")
          with open("work/files.json","w") as out:
              json.dump({"record":"16024158","doi":"10.5281/zenodo.16024158","title":rec.get("metadata",{}).get("title"),"license":rec.get("metadata",{}).get("license"),"files":[{"path":p,"size":s,"download":u} for p,s,u in files]},out,indent=2,ensure_ascii=False)
          print("files",len(files))
          for p,s,u in files:
              print(s,p,u)
          PY

          python - <<'PY'
          import json
          d=json.load(open("work/files.json"))
          with open("work/file-list.txt","w") as f:
              for i,x in enumerate(d["files"],1):
                  f.write(f'{i}\t{x["size"]}\t{x["path"]}\t{x["download"]}\n')
          PY

          n=0
          while IFS=$'\t' read -r idx size path url; do
            [ -z "$path" ] && continue
            n=$((n+1))
            safe=$(printf '%s' "$path" | tr '/ ' '__')
            out="work/${n}-${safe}"
            curl -L --fail --retry 6 --retry-all-errors -o "$out" "$url"
            test -s "$out"
            sha=$(sha256sum "$out" | awk '{print $1}')
            bytes=$(stat -c%s "$out")
            printf '{"source":"TXTperpus","zenodo_record":"16024158","doi":"10.5281/zenodo.16024158","path":"%s","bytes":%s,"sha256":"%s"}\n' "$path" "$bytes" "$sha" > "$out.manifest.json"
            gh release upload "$TAG" --repo "$REPO" "$out" "$out.manifest.json" --clobber
            rm -f "$out" "$out.manifest.json"
          done < work/file-list.txt

          gh release upload "$TAG" --repo "$REPO" work/files.json work/file-list.txt --clobber
          echo "TXTperpus K1 harvest finished."
