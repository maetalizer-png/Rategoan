name: harvest-k1-hf-batch

on:
  push:
    branches: [main]

concurrency:
  group: harvest-k1-hf-batch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  harvest:
    if: contains(github.event.head_commit.message, '[harvest-k1-hf-batch]')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: data-baru-k1-corpus-indonesia-2026-09
    steps:
      - name: Prepare release
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          mkdir -p work

      - name: Download public Indonesian slice from Aya Collection
        run: |
          set -euo pipefail
          url='https://huggingface.co/datasets/CohereLabs/aya_collection_language_split/resolve/main/indonesian/train-00000-of-00001.parquet?download=true'
          curl -L --fail --retry 8 --retry-all-errors -o work/aya_indonesian.parquet "$url"
          test -s work/aya_indonesian.parquet
          sha256sum work/aya_indonesian.parquet > work/aya_indonesian.parquet.sha256
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" work/aya_indonesian.parquet work/aya_indonesian.parquet.sha256 --clobber
          rm -f work/aya_indonesian.parquet work/aya_indonesian.parquet.sha256

      - name: Download gated Indonesian STEM textbook corpus when HF access is configured
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${HF_TOKEN:-}" ]; then echo 'HF_TOKEN secret not configured; skipping gated STEM corpus.'; exit 0; fi
          python -m pip install -q -U huggingface_hub
          mkdir -p work/stem
          HF_TOKEN="$HF_TOKEN" hf download InfoBayAI/Indonesian-STEM-Textbook-Dataset --repo-type dataset --local-dir work/stem --max-workers 8
          find work/stem -type f -size +0c -print0 | while IFS= read -r -d '' f; do
            size=$(stat -c%s "$f")
            if [ "$size" -lt 1900000000 ]; then
              sha256sum "$f" > "$f.sha256"
              gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" "$f" "$f.sha256" --clobber
            else
              split -b 1800m -d -a 3 "$f" "${f}.part-"
              for p in "${f}".part-*; do sha256sum "$p" > "$p.sha256"; gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" "$p" "$p.sha256" --clobber; done
            fi
          done
          rm -rf work/stem

      - name: Download gated Indonesian Non-STEM textbook corpus when HF access is configured
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${HF_TOKEN:-}" ]; then echo 'HF_TOKEN secret not configured; skipping gated Non-STEM corpus.'; exit 0; fi
          python -m pip install -q -U huggingface_hub
          mkdir -p work/nonstem
          HF_TOKEN="$HF_TOKEN" hf download InfoBayAI/Indonesian-Non-STEM-Textbook-Dataset --repo-type dataset --local-dir work/nonstem --max-workers 8
          find work/nonstem -type f -size +0c -print0 | while IFS= read -r -d '' f; do
            size=$(stat -c%s "$f")
            if [ "$size" -lt 1900000000 ]; then
              sha256sum "$f" > "$f.sha256"
              gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" "$f" "$f.sha256" --clobber
            else
              split -b 1800m -d -a 3 "$f" "${f}.part-"
              for p in "${f}".part-*; do sha256sum "$p" > "$p.sha256"; gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" "$p" "$p.sha256" --clobber; done
            fi
          done
          rm -rf work/nonstem

      - name: Write harvest manifest
        run: |
          printf '%s\n' \
            'release=data-baru-k1-corpus-indonesia-2026-09' \
            'added=CohereLabs/aya_collection_language_split:indonesian/train' \
            'gated=InfoBayAI/Indonesian-STEM-Textbook-Dataset' \
            'gated=InfoBayAI/Indonesian-Non-STEM-Textbook-Dataset' \
            'note=Textbook corpora are uploaded only if repository HF_TOKEN secret has gated access.' \
            > work/hf-batch-manifest.txt
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" work/hf-batch-manifest.txt --clobber
