name: cleanup-small-releases
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete small experimental releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="maetalizer-png/Rategoan"
          for tag in data-baru-eos-cpt-2026-09 data-baru-batch-02-2026-09 data-baru-batch-03-2026-09 data-baru-fineweb2-k1-2026-09; do
            if gh release view "$tag" --repo "$REPO" >/dev/null 2>&1; then
              gh release delete "$tag" --repo "$REPO" --cleanup-tag --yes
            else
              echo "already absent: $tag"
            fi
          done
