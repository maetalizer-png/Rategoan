name: repair-k1-corpus-indonesia

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: contains(github.event.head_commit.message, '[repair-corpus-indonesia]')
    runs-on: ubuntu-latest
    steps:
      - name: Repair release assets from HF
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="maetalizer-png/Rategoan"
          TAG="data-baru-k1-corpus-indonesia-2026-09"
          mkdir -p work
          python - <<'PY'
          import json, urllib.request
          api="https://huggingface.co/api/datasets/Lyon28/Corpus-Indonesia/tree/main?recursive=true&expand=false"
          with urllib.request.urlopen(api, timeout=120) as r:
              items=json.load(r)
          files=[]
          for x in items:
              p=x.get("path","")
              if x.get("type")=="file" and p.lower().endswith(".parquet"):
                  files.append((p,int(x.get("size") or 0)))
          files.sort()
          total=sum(s for _,s in files)
          json.dump({"repo":"Lyon28/Corpus-Indonesia","license":"Apache-2.0","files":files,"total_bytes":total},
                    open("work/files.json","w"), indent=2)
          print(f"HF files={len(files)} total_bytes={total}")
          if len(files) != 7 or total != 1900362972:
              raise SystemExit(f"Unexpected HF inventory: {len(files)} files, {total} bytes")
          PY
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            asset=$(printf '%s' "$path" | sed 's#/#__#g')
            out="work/$asset"
            curl -L --fail --retry 6 --retry-all-errors -o "$out" "https://huggingface.co/datasets/Lyon28/Corpus-Indonesia/resolve/main/$path?download=true"
            test "$(stat -c%s "$out")" -eq "$(python -c "import json; d=json.load(open('work/files.json')); print(dict(d['files'])['$path'])")"
            for attempt in 1 2 3 4 5; do
              if gh release upload "$TAG" --repo "$REPO" "$out" --clobber; then break; fi
              if [ "$attempt" -eq 5 ]; then exit 1; fi
              sleep $((attempt*90))
            done
            rm -f "$out"
          done < <(python -c 'import json; [print(p) for p,_ in json.load(open("work/files.json"))["files"]]')
          for attempt in 1 2 3 4 5; do
            if gh release upload "$TAG" --repo "$REPO" work/files.json --clobber; then break; fi
            if [ "$attempt" -eq 5 ]; then exit 1; fi
            sleep $((attempt*90))
          done
          echo "REPAIR COMPLETE"

# Triggered 2026-09-30: verify and repair the same release asset set.
