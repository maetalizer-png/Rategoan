name: execute-penampung-data-move

on:
  push:
    paths:
      - '.github/workflows/move-penampung-run.yml'

permissions:
  contents: write

jobs:
  move:
    runs-on: ubuntu-latest
    timeout-minutes: 720
    steps:
      - name: Copy every dataset asset from penampung into one release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="maetalizer-png/Rategoan"
          SRC="penampung"
          DST="data-baru-k1-k2-2026-09"
          mkdir -p work

          gh release view "$DST" --repo "$REPO" >/dev/null 2>&1 || gh release create "$DST" --repo "$REPO" \
            --title "Data Baru K1/K2 — Consolidated — 2026-09" \
            --notes "Datasets moved from the Penampung release. Original SHA-256 values are checked before deletion from source. Documentation is excluded."

          gh api "repos/$REPO/releases/tags/$SRC" --paginate --jq '.assets[] | [.id,.name,.size,.digest] | @tsv' > work/assets.tsv

          while IFS=$'\t' read -r id name size digest; do
            [ -z "$name" ] && continue
            case "$name" in PRD-GROK-BUILD.md) continue;; esac
            echo "MOVING: $name ($size bytes)"
            rm -rf work/item && mkdir -p work/item
            gh release download "$SRC" --repo "$REPO" --pattern "$name" --dir work/item --clobber
            file="work/item/$name"
            test -s "$file"
            actual="sha256:$(sha256sum "$file" | awk '{print $1}')"
            test "$actual" = "$digest"
            gh release upload "$DST" --repo "$REPO" "$file" --clobber
            gh api --method DELETE "repos/$REPO/releases/assets/$id"
            rm -f "$file"
            echo "MOVED: $name"
          done < work/assets.tsv

          echo 'SOURCE AFTER MOVE:'
          gh api "repos/$REPO/releases/tags/$SRC" --jq '.assets[] | .name'
          echo 'DESTINATION:'
          gh api "repos/$REPO/releases/tags/$DST" --jq '.assets[] | [.name,.size] | @tsv'

# execute move now
