name: harvest-coding-stackv3-to-penampung

on:
  push:
    branches: [main]

concurrency:
  group: harvest-coding-stackv3-to-penampung
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  harvest:
    if: contains(github.event.head_commit.message, '[harvest-coding-stackv3]')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Download large code shards from Hugging Face
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="maetalizer-png/Rategoan"
          TAG="penampung"
          mkdir -p work

          python - <<'PY'
          import json, urllib.request
          api='https://huggingface.co/api/datasets/HuggingFaceCode/stack-v3-train/tree/main?recursive=true&expand=false'
          with urllib.request.urlopen(api, timeout=180) as r:
              items=json.load(r)
          files=[]
          for x in items:
              p=x.get('path','')
              s=int(x.get('size') or 0)
              if x.get('type')=='file' and p.startswith('data/') and p.endswith('.parquet'):
                  files.append((p,s))
          files.sort()
          if not files:
              raise SystemExit('No parquet shards found')
          # Use several large, real code shards. Keep each GitHub release asset below 2 GiB.
          chosen=[]
          total=0
          for p,s in files:
              if s >= 100_000_000 and s < 1_900_000_000:
                  chosen.append((p,s))
                  total += s
              if len(chosen) >= 6:
                  break
          if not chosen:
              raise SystemExit('No suitable shards found')
          with open('work/manifest.json','w') as f:
              json.dump({'source':'HuggingFaceCode/stack-v3-train','purpose':'coding pretraining','license':'ODC-By-1.0 plus original repository license obligations','selected_shards':chosen,'total_bytes':total},f,indent=2)
          print('selected',len(chosen),'total',total)
          for p,s in chosen: print(s,p)
          PY

          gh release view "$TAG" --repo "$REPO" >/dev/null

          n=0
          while IFS=$'\t' read -r path size; do
            [ -z "$path" ] && continue
            n=$((n+1))
            base=$(basename "$path")
            out="work/coding-stackv3-part$(printf '%02d' "$n")-${base}"
            curl -L --fail --retry 8 --retry-all-errors -o "$out" "https://huggingface.co/datasets/HuggingFaceCode/stack-v3-train/resolve/main/$path?download=true"
            test -s "$out"
            actual=$(stat -c%s "$out")
            sha=$(sha256sum "$out" | awk '{print $1}')
            printf '%s  %s\n' "$sha" "$(basename "$out")" >> work/SHA256SUMS
            echo "Downloaded $out: $actual bytes"
            gh release upload "$TAG" --repo "$REPO" "$out" --clobber
            rm -f "$out"
          done < <(python - <<'PY'
          import json
          for p,s in json.load(open('work/manifest.json'))['selected_shards']:
              print(f'{p}\t{s}')
          PY
          )

          gh release upload "$TAG" --repo "$REPO" work/manifest.json work/SHA256SUMS --clobber
          echo "CODING HARVEST COMPLETE"
