name: harvest-k1-corpus-indonesia
on:
  push:
    branches: [main]
concurrency:
  group: harvest-k1-corpus-indonesia
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Harvest public Indonesian K1 corpus
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          set -euo pipefail
          REPO="maetalizer-png/Rategoan"
          TAG="data-baru-k1-corpus-indonesia-2026-09"
          mkdir -p work
          gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1 || gh release create "$TAG" --repo "$REPO" --title "Data Baru K1 — Corpus Indonesia — 2026-09" --notes "Standalone K1 candidate. Source: Lyon28/Corpus-Indonesia on Hugging Face. License: Apache-2.0."
          python - <<'PY'
          import json, urllib.request
          api="https://huggingface.co/api/datasets/Lyon28/Corpus-Indonesia/tree/main?recursive=true&expand=false"
          with urllib.request.urlopen(api, timeout=120) as r: items=json.load(r)
          files=[]
          for x in items:
              p=x.get("path","")
              if x.get("type")=="file" and p.lower().endswith((".parquet",".jsonl",".jsonl.gz",".csv",".csv.gz",".txt",".txt.gz")):
                  files.append((p,int(x.get("size") or 0)))
          files.sort()
          if not files: raise SystemExit("No source corpus files found")
          total=sum(s for _,s in files)
          json.dump({"repo":"Lyon28/Corpus-Indonesia","ref":"main","license":"Apache-2.0","files":files,"total_bytes":total},open("work/files.json","w"),indent=2)
          print("SOURCE_FILE_COUNT",len(files)); print("SOURCE_TOTAL_BYTES",total)
          for p,s in files: print("SOURCE_FILE",s,p)
          PY
          python - <<'PY'
          import json
          d=json.load(open("work/files.json"))
          with open("work/file-list.txt","w") as f:
              for i,(p,s) in enumerate(d["files"],1): f.write(f"{i}\t{s}\t{p}\n")
          PY
          n=0
          while IFS=$'\t' read -r idx size path; do
            [ -z "$path" ] && continue
            n=$((n+1))
            safe=$(printf '%s' "$path" | sed 's#[^A-Za-z0-9._-]#_#g')
            out="work/\${n}-\${safe}"
            curl -L --fail --retry 6 --retry-all-errors -o "$out" "https://huggingface.co/datasets/Lyon28/Corpus-Indonesia/resolve/main/$path?download=true"
            test -s "$out"
            actual=$(stat -c%s "$out")
            test "$actual" -eq "$size"
            sha=$(sha256sum "$out" | awk '{print $1}')
            printf '{"source":"Lyon28/Corpus-Indonesia","ref":"main","path":"%s","bytes":%s,"sha256":"%s","license":"Apache-2.0"}\n' "$path" "$actual" "$sha" > "$out.manifest.json"
            gh release upload "$TAG" --repo "$REPO" "$out" "$out.manifest.json" --clobber
            rm -f "$out" "$out.manifest.json"
          done < work/file-list.txt
          gh release upload "$TAG" --repo "$REPO" work/files.json work/file-list.txt --clobber
          echo "K1 Corpus Indonesia harvest finished: verified $n source data files."

      - name: Harvest Indonesian textbook corpora from Hugging Face
        env:
          GH_TOKEN: ${{ github.token }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          REPO="maetalizer-png/Rategoan"
          TAG="data-baru-k1-corpus-indonesia-2026-09"
          test -n "${HF_TOKEN:-}" || { echo "HF_TOKEN GitHub secret is not configured"; exit 1; }
          mkdir -p work-textbooks
          for HF_REPO in "InfoBayAI/Indonesian-STEM-Textbook-Dataset" "InfoBayAI/Indonesian-Non-STEM-Textbook-Dataset"; do
            slug=$(printf "%s" "$HF_REPO" | tr "/" "_")
            python - "$HF_REPO" "$slug" <<'PY'
import json,sys,urllib.request,os
repo,slug=sys.argv[1:3]
req=urllib.request.Request(f"https://huggingface.co/api/datasets/{repo}/tree/main?recursive=true&expand=false",headers={"Authorization":"Bearer "+os.environ["HF_TOKEN"]})
with urllib.request.urlopen(req,timeout=120) as r: items=json.load(r)
files=[]
for x in items:
    p=x.get("path","")
    if x.get("type")=="file" and p.lower().endswith((".parquet",".jsonl",".jsonl.gz",".txt",".txt.gz")): files.append((p,int(x.get("size") or 0)))
files.sort()
if not files: raise SystemExit(f"No downloadable text files found for {repo}")
json.dump({"repo":repo,"ref":"main","files":files,"total_bytes":sum(s for _,s in files)},open(f"work-textbooks/{slug}.json","w"),indent=2)
print(repo,"files",len(files),"bytes",sum(s for _,s in files))
PY
          done
          for manifest in work-textbooks/*.json; do
            HF_REPO=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["repo"])' "$manifest")
            slug=$(basename "$manifest" .json)
            python - "$manifest" <<'PY' > work-textbooks/current.queue
import json,sys
d=json.load(open(sys.argv[1]))
for i,(p,s) in enumerate(d["files"],1): print(f"{i}\t{s}\t{p}")
PY
            while IFS=$'\t' read -r idx size path; do
              [ -z "$path" ] && continue
              safe=$(printf "%s" "$path" | sed 's#[^A-Za-z0-9._-]#_#g')
              out="work-textbooks/${slug}-${idx}-${safe}"
              curl -L --fail --retry 6 --retry-all-errors -H "Authorization: Bearer $HF_TOKEN" -o "$out" "https://huggingface.co/datasets/${HF_REPO}/resolve/main/$path?download=true"
              test -s "$out"
              actual=$(stat -c%s "$out")
              test "$actual" -eq "$size"
              sha=$(sha256sum "$out" | awk '{print $1}')
              printf '{"source":"%s","ref":"main","path":"%s","bytes":%s,"sha256":"%s","license":"CC-BY-4.0"}\n' "$HF_REPO" "$path" "$actual" "$sha" > "$out.manifest.json"
              gh release upload "$TAG" --repo "$REPO" "$out" "$out.manifest.json" --clobber
              rm -f "$out" "$out.manifest.json"
            done < work-textbooks/current.queue
          done
          gh release upload "$TAG" --repo "$REPO" work-textbooks/*.json --clobber
          echo "Textbook harvest finished."