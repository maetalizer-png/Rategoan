name: harvest-k1-corpus-indonesia

on:
  push:
    branches: [main]

concurrency:
  group: harvest-k1-corpus-indonesia
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  harvest:
    if: contains(github.event.head_commit.message, '[harvest-k1-corpus]')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Harvest public Indonesian K1 sources into one existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="maetalizer-png/Rategoan"
          TAG="data-baru-k1-corpus-indonesia-2026-09"
          mkdir -p work
          gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1 || gh release create "$TAG" --repo "$REPO" --title "Data Baru K1 — Corpus Indonesia — 2026-09" --notes "Standalone K1 candidates kept together until cleaning/deduplication and overlap audit."
          harvest_repo() {
            HF_REPO="$1"
            echo "=== HARVEST $HF_REPO ==="
            python - "$HF_REPO" <<'PY'
import json,sys,urllib.request
repo=sys.argv[1]
api=f"https://huggingface.co/api/datasets/{repo}/tree/main?recursive=true&expand=false"
with urllib.request.urlopen(api,timeout=120) as r: items=json.load(r)
files=[]
for x in items:
    p=x.get("path","")
    if x.get("type")=="file" and p.lower().endswith((".parquet",".jsonl",".jsonl.gz",".csv",".csv.gz",".txt",".txt.gz")):
        files.append((p,int(x.get("size") or 0)))
files.sort()
if not files: raise SystemExit(f"No downloadable files for {repo}")
print("SOURCE_FILE_COUNT",len(files),"SOURCE_TOTAL_BYTES",sum(s for _,s in files))
fn="work/"+repo.replace("/","__")+"-files.json"
json.dump({"repo":repo,"ref":"main","files":files,"total_bytes":sum(s for _,s in files)},open(fn,"w"),indent=2)
PY
            repo_safe=$(printf "%s" "$HF_REPO" | sed "s#[^A-Za-z0-9._-]#_#g")
            gh release upload "$TAG" --repo "$REPO" "work/${repo_safe}-files.json" --clobber
            python - "$HF_REPO" <<'PY' > "work/list.tsv"
import json,sys
repo=sys.argv[1]; d=json.load(open("work/"+repo.replace("/","__")+"-files.json"))
for i,(p,s) in enumerate(d["files"],1): print(f"{i}\t{s}\t{p}")
PY
            while IFS=$'\t' read -r idx size path; do
              [ -z "$path" ] && continue
              safe=$(printf "%s" "$path" | sed "s#[^A-Za-z0-9._-]#_#g")
              out="work/${repo_safe}-${idx}-${safe}"
              echo "DOWNLOAD $HF_REPO:$path ($size bytes)"
              curl -L --fail --retry 6 --retry-all-errors -o "$out" "https://huggingface.co/datasets/${HF_REPO}/resolve/main/$path?download=true"
              actual=$(stat -c%s "$out")
              test "$actual" -eq "$size"
              sha=$(sha256sum "$out" | awk '{print $1}')
              printf '{"source":"%s","ref":"main","path":"%s","bytes":%s,"sha256":"%s"}\n' "$HF_REPO" "$path" "$actual" "$sha" > "$out.manifest.json"
              gh release upload "$TAG" --repo "$REPO" "$out" "$out.manifest.json" --clobber
              rm -f "$out" "$out.manifest.json"
            done < work/list.tsv
            rm -f work/list.tsv
          }
          harvest_repo "Lyon28/Corpus-Indonesia"
          harvest_repo "Ik45/data-science-en-id"
          echo "ALL PUBLIC K1 SOURCES COMPLETE IN $TAG"

# [harvest-k1-corpus] execute repaired consolidated public harvest
