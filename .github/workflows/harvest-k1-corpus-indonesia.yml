name: harvest-k1-corpus-indonesia

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  harvest-indo4b:
    if: contains(github.event.head_commit.message, '[harvest-indo4b]')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: maetalizer-png/Rategoan
      TAG: data-baru-k1-indo4b-deepclean-2026-09
      HF_REPO: img-gemina/indonesian-corpus-2b-deepclean-indo4b
    steps:
      - name: Download and split HF artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work
          URL="https://huggingface.co/datasets/${HF_REPO}/resolve/main/indonesian_corpus_1p8b_deepclean_indo4b.jsonl.gz?download=true"
          curl -L --fail --retry 8 --retry-all-errors -o work/source.jsonl.gz "$URL"
          test -s work/source.jsonl.gz
          stat -c 'SOURCE_BYTES=%s' work/source.jsonl.gz
          split -b 1800m -d -a 3 work/source.jsonl.gz work/indo4b.part.
          sha256sum work/source.jsonl.gz > work/source.sha256
      - name: Upload chunks to existing release
        shell: bash
        run: |
          set -euo pipefail
          n=0
          for f in work/indo4b.part.*; do
            n=$((n+1))
            name=$(printf 'indo4b-deepclean-part-%02d.jsonl.gz' "$n")
            mv "$f" "work/$name"
            sha=$(sha256sum "work/$name" | awk '{print $1}')
            bytes=$(stat -c%s "work/$name")
            printf '{"source":"%s","path":"indonesian_corpus_1p8b_deepclean_indo4b.jsonl.gz","part":%s,"bytes":%s,"sha256":"%s","license":"CC-BY-4.0"}\n' "$HF_REPO" "$n" "$bytes" "$sha" > "work/$name.manifest.json"
            gh release upload "$TAG" --repo "$REPO" "work/$name" "work/$name.manifest.json" --clobber
          done
          gh release upload "$TAG" --repo "$REPO" work/source.sha256 --clobber
          echo "INDO4B_HARVEST_COMPLETE parts=$n"
