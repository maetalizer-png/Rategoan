name: Consolidate data-baru assets

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/consolidate-data-baru.yml

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Copy every data-baru-* asset into the single data-baru release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          owner="maetalizer-png"
          repo="Rategoan"
          api="https://api.github.com/repos/$owner/$repo"
          mkdir -p /tmp/consolidate
          cd /tmp/consolidate

          gh api "$api/releases/tags/data-baru" --jq '.assets[].name' | sort -u > existing.txt
          gh api "$api/releases?per_page=100" > releases.json

          python - <<'PY'
          import json, re, os, subprocess, urllib.request
          releases=json.load(open("releases.json"))
          sources=[r for r in releases if r.get("tag_name","").startswith("data-baru-")]
          existing=set(open("existing.txt").read().splitlines())
          manifest=[]
          for r in sources:
              tag=r["tag_name"]
              prefix=re.sub(r"[^A-Za-z0-9._-]+","_",tag)
              for a in r.get("assets",[]):
                  old=a["name"]
                  new=f"{prefix}__{old}"
                  if new in existing:
                      continue
                  path="/tmp/consolidate/"+new
                  print("DOWNLOAD",tag,old,a["size"],flush=True)
                  req=urllib.request.Request(a["browser_download_url"],headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/octet-stream"})
                  with urllib.request.urlopen(req) as resp, open(path,"wb") as out:
                      while True:
                          b=resp.read(16*1024*1024)
                          if not b: break
                          out.write(b)
                  got=os.path.getsize(path)
                  if got != a["size"]:
                      raise RuntimeError(f"SIZE MISMATCH {tag}/{old}: {a['size']} != {got}")
                  print("UPLOAD",new,got,flush=True)
                  subprocess.run(["gh","release","upload","data-baru",path,"--repo","maetalizer-png/Rategoan","--clobber"],check=True)
                  manifest.append([tag,old,new,got])
                  existing.add(new)
                  os.remove(path)
          with open("consolidation-manifest.tsv","w") as f:
              for row in manifest:
                  f.write("\t".join(map(str,row))+"\n")
          print("NEW_ASSETS",len(manifest),flush=True)
          print("SOURCE_RELEASES",len(sources),flush=True)
          PY

          gh release upload data-baru consolidation-manifest.tsv --repo "$owner/$repo" --clobber || true
          gh release view data-baru --repo "$owner/$repo" --json tagName,assets --jq '{tag:.tagName,asset_count:(.assets|length),total_bytes:([.assets[].size]|add)}'
