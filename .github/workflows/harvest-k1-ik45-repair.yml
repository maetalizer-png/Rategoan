name: harvest-k1-ik45-repair
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Harvest Ik45 data-science-en-id into existing K1 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="maetalizer-png/Rategoan"
          TAG="data-baru-k1-corpus-indonesia-2026-09"
          HF_REPO="Ik45/data-science-en-id"
          gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1 || gh release create "$TAG" --repo "$REPO" --title "Data Baru K1 — Corpus Indonesia — 2026-09" --notes "Standalone K1 candidates kept together until cleaning/deduplication."
          mkdir -p work
          python - <<'PY'
import json, urllib.request
repo="Ik45/data-science-en-id"
url=f"https://huggingface.co/api/datasets/{repo}/tree/main?recursive=true&expand=false"
with urllib.request.urlopen(url,timeout=120) as r:
    items=json.load(r)
files=[]
for x in items:
    p=x.get("path","")
    if x.get("type")=="file" and p.lower().endswith((".parquet",".jsonl",".jsonl.gz",".txt",".txt.gz",".csv",".csv.gz")):
        files.append((p,int(x.get("size") or 0)))
files.sort()
if not files: raise SystemExit("No downloadable files found")
json.dump({"repo":repo,"ref":"main","files":files,"total_bytes":sum(s for _,s in files)},open("work/Ik45_data-science-en-id-files.json","w"),indent=2)
print("FILES",len(files),"TOTAL_BYTES",sum(s for _,s in files))
PY
          gh release upload "$TAG" --repo "$REPO" work/Ik45_data-science-en-id-files.json --clobber
          while IFS=$'\t' read -r idx size path; do
            safe=$(printf "%s" "$path" | sed 's#[^A-Za-z0-9._-]#_#g')
            out="work/Ik45_data-science-en-id-${idx}-${safe}"
            echo "DOWNLOAD $path $size"
            curl -L --fail --retry 6 --retry-all-errors -o "$out" "https://huggingface.co/datasets/${HF_REPO}/resolve/main/$path?download=true"
            actual=$(stat -c%s "$out")
            test "$actual" -eq "$size"
            sha=$(sha256sum "$out" | awk '{print $1}')
            printf '{"source":"%s","ref":"main","path":"%s","bytes":%s,"sha256":"%s"}\n' "$HF_REPO" "$path" "$actual" "$sha" > "$out.manifest.json"
            gh release upload "$TAG" --repo "$REPO" "$out" "$out.manifest.json" --clobber
            rm -f "$out" "$out.manifest.json"
          done < <(python - <<'PY'
import json
for i,(p,s) in enumerate(json.load(open("work/Ik45_data-science-en-id-files.json"))["files"],1):
    print(f"{i}\t{s}\t{p}")
PY
)
          echo "IK45 HARVEST COMPLETE"
