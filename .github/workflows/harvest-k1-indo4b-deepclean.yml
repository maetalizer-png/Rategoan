name: harvest-k1-indo4b-deepclean

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  harvest:
    if: contains(github.event.head_commit.message, '[harvest-k1-indo4b]')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Download HF corpus and publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="maetalizer-png/Rategoan"
          TAG="data-baru-k1-indo4b-deepclean-2026-09"
          URL="https://huggingface.co/datasets/img-gemina/indonesian-corpus-2b-deepclean-indo4b/resolve/main/indonesian_corpus_1p8b_deepclean_indo4b.jsonl.gz?download=true"
          mkdir -p work

          gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1 || gh release create "$TAG" --repo "$REPO" \
            --title "Data Baru K1 — Indo4B DeepClean 1.8B — 2026-09" \
            --notes "Source: img-gemina/indonesian-corpus-2b-deepclean-indo4b on Hugging Face. 25,553,595 documents; 1,801,814,049 tokens; CC-BY-4.0. Standalone K1 candidate; not merged into canonical K1. Original HF artifact: indonesian_corpus_1p8b_deepclean_indo4b.jsonl.gz."

          curl -L --fail --retry 8 --retry-all-errors --connect-timeout 30 -o work/indo4b.jsonl.gz "$URL"
          test -s work/indo4b.jsonl.gz
          sha256sum work/indo4b.jsonl.gz | tee work/sha256.txt
          stat -c '%s bytes' work/indo4b.jsonl.gz

          # GitHub release assets have a 2 GiB per-asset limit; split into <=1.9 GiB chunks.
          split -b 1900M -d -a 3 work/indo4b.jsonl.gz work/indo4b.jsonl.gz.part-

          python - <<'PY'
          import glob,os,json,hashlib
          parts=sorted(glob.glob('work/indo4b.jsonl.gz.part-*'))
          manifest={'source':'img-gemina/indonesian-corpus-2b-deepclean-indo4b','hf_file':'indonesian_corpus_1p8b_deepclean_indo4b.jsonl.gz','tokens':1801814049,'documents':25553595,'license':'cc-by-4.0','parts':[]}
          for p in parts:
              h=hashlib.sha256()
              with open(p,'rb') as f:
                  for b in iter(lambda:f.read(1024*1024),b''): h.update(b)
              manifest['parts'].append({'file':os.path.basename(p),'bytes':os.path.getsize(p),'sha256':h.hexdigest()})
          with open('work/manifest.json','w') as f: json.dump(manifest,f,indent=2)
          print(json.dumps(manifest,indent=2))
          PY

          gh release upload "$TAG" --repo "$REPO" work/manifest.json work/sha256.txt --clobber
          for f in work/indo4b.jsonl.gz.part-*; do
            gh release upload "$TAG" --repo "$REPO" "$f" --clobber
          done

          echo "HARVEST COMPLETE: $TAG"
