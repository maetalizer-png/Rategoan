name: Publish new standalone EOS Indonesian corpus

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    if: contains(github.event.head_commit.message, '[publish-eos-new]')
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install huggingface_hub pyarrow

      - name: Download EOS source
        env:
          HF_DATASET: taqiyudinadn/EOS-Continued-Pretraining-Dataset
        run: |
          python - <<'PY'
          from huggingface_hub import hf_hub_download
          repo = "taqiyudinadn/EOS-Continued-Pretraining-Dataset"
          for name in [
              "data/train-00000-of-00002.parquet",
              "data/train-00001-of-00002.parquet",
          ]:
              p = hf_hub_download(repo_id=repo, filename=name, repo_type="dataset")
              print(p)
          PY

      - name: Clean, deduplicate, filter obvious Wikipedia overlap, package
        run: |
          cat > /tmp/build_eos.py <<'PY'
          import csv
          import gzip
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          import pyarrow.parquet as pq
          from huggingface_hub import hf_hub_download

          OUT = Path("/tmp/eos-cpt-indonesian-new.jsonl.gz")
          MANIFEST = Path("/tmp/manifest.json")
          REPO = "taqiyudinadn/EOS-Continued-Pretraining-Dataset"

          files = [
              hf_hub_download(repo_id=REPO, filename="data/train-00000-of-00002.parquet", repo_type="dataset"),
              hf_hub_download(repo_id=REPO, filename="data/train-00001-of-00002.parquet", repo_type="dataset"),
          ]

          spaces = re.compile(r"\s+")
          urlish = re.compile(r"https?://\S+|www\.\S+", re.I)
          wiki_markers = [
              "pranala luar",
              "lihat pula",
              "bacaan lanjutan",
              "referensi",
          ]

          id_stop = {
              "yang","dan","dari","dengan","untuk","dalam","pada","adalah",
              "ini","itu","sebagai","oleh","tidak","atau","karena","akan",
              "juga","telah","lebih","dapat","tahun","sebuah","tersebut",
              "bahwa","menjadi","masyarakat","negara","pemerintah"
          }

          seen = set()
          docs = 0
          words = 0
          dropped_short = 0
          dropped_wiki = 0
          dropped_dup = 0

          with gzip.open(OUT, "wt", encoding="utf-8", compresslevel=9) as g:
              for path in files:
                  pf = pq.ParquetFile(path)
                  for batch in pf.iter_batches(batch_size=4096, columns=["text"]):
                      for raw in batch.column(0).to_pylist():
                          if not isinstance(raw, str):
                              continue
                          text = spaces.sub(" ", raw.replace("\x00", " ")).strip()
                          text = urlish.sub(" ", text)
                          text = spaces.sub(" ", text).strip()

                          if len(text) < 200:
                              dropped_short += 1
                              continue

                          low = text.lower()
                          marker_hits = sum(1 for m in wiki_markers if m in low)
                          if marker_hits >= 3:
                              dropped_wiki += 1
                              continue

                          fp = hashlib.sha1(text.encode("utf-8")).hexdigest()
                          if fp in seen:
                              dropped_dup += 1
                              continue
                          seen.add(fp)

                          toks = text.split()
                          if len(toks) < 40:
                              dropped_short += 1
                              continue

                          sample = [t.strip(".,;:!?()[]{}\"'").lower() for t in toks[:250]]
                          id_hits = sum(1 for t in sample if t in id_stop)
                          if len(sample) >= 40 and id_hits < 4:
                              continue

                          row = {
                              "text": text,
                              "source": "taqiyudinadn/EOS-Continued-Pretraining-Dataset",
                              "license": "Apache-2.0",
                              "lang": "id",
                              "provenance": "EOS CPT (DTP/PRD news-government-web crawl; upstream card also reports ~13.2% Wikipedia ID regularization)",
                          }
                          g.write(json.dumps(row, ensure_ascii=False) + "\n")
                          docs += 1
                          words += len(toks)

          import hashlib
          h = hashlib.sha256()
          with OUT.open("rb") as f:
              for chunk in iter(lambda: f.read(1024 * 1024), b""):
                  h.update(chunk)

          manifest = {
              "nama": "eos-cpt-indonesian-new",
              "tag": "data-baru-eos-cpt-2026-09",
              "status": "standalone-new-source-release",
              "bukanK1K2K3K4": True,
              "kategori": "pelengkap",
              "upstream": {
                  "dataset": REPO,
                  "license": "Apache-2.0",
                  "upstream_rows": 141969,
                  "upstream_total_size_bytes": 343000000,
                  "upstream_claimed_tokens": 214200000,
                  "known_overlap": "Upstream card reports ~13.2% Wikipedia ID. Obvious Wikipedia-style rows are filtered heuristically; remaining content is kept as a standalone source snapshot, not merged into canonical shelves."
              },
              "processing": {
                  "normalisasi_whitespace": True,
                  "remove_urls": True,
                  "min_chars": 200,
                  "min_words": 40,
                  "exact_dedupe_sha1": True,
                  "obvious_wikipedia_marker_filter": ">=3 markers",
                  "simple_indonesian_stopword_gate": True
              },
              "hasil": {
                  "dokumen": docs,
                  "kata_approx": words,
                  "sizeByteGz": OUT.stat().st_size,
                  "sha256": h.hexdigest()
              },
              "license": "Apache-2.0",
              "komposisiBahasa": {"id": 100.0},
              "catatan": {
                  "dropped_short": dropped_short,
                  "dropped_obvious_wikipedia": dropped_wiki,
                  "dropped_exact_duplicate": dropped_dup,
                  "training": "Standalone only; do not place in K1/K2/K3/K4."
              }
          }

          MANIFEST.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(manifest, ensure_ascii=False, indent=2))
          PY
          python /tmp/build_eos.py

      - name: Create standalone GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: data-baru-eos-cpt-2026-09
          TITLE: "Data Baru — EOS CPT Indonesian (Standalone)"
        run: |
          gh release create "$TAG"             "/tmp/eos-cpt-indonesian-new.jsonl.gz"             "/tmp/manifest.json"             --title "$TITLE"             --notes "Dataset baru dari taqiyudinadn/EOS-Continued-Pretraining-Dataset. Standalone; TIDAK masuk K1/K2/K3/K4. Apache-2.0. Diproses: normalisasi, dedupe exact, filter bahasa ID, dan filter heuristik baris bergaya Wikipedia. Upstream menyatakan ~13,2% Wikipedia sebagai regularization; angka hasil release ada di manifest."             --latest

      - name: Verify release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: data-baru-eos-cpt-2026-09
        run: |
          gh release view "$TAG" --json name,tagName,assets,url
