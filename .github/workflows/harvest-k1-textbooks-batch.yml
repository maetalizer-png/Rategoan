name: harvest-k1-textbooks-batch

on:
  push:
    branches: [main]

concurrency:
  group: harvest-k1-textbooks-batch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  harvest:
    if: contains(github.event.head_commit.message, '[harvest-k1-textbooks]')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Download large educational book corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="maetalizer-png/Rategoan"
          TAG="data-baru-k1-textbooks-2026-09"
          SRC="haznitrama/indonesian-children-books"
          mkdir -p work
          gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1 || gh release create "$TAG" --repo "$REPO" --title "Data Baru K1 — Textbooks & Educational Books — 2026-09" --notes "Educational book harvest; kept outside canonical K1 pending deduplication and license audit."
          python - <<'PY'
          import json, urllib.request
          repo='haznitrama/indonesian-children-books'
          url=f'https://huggingface.co/api/datasets/{repo}/tree/main?recursive=true&expand=false'
          with urllib.request.urlopen(url, timeout=120) as r: items=json.load(r)
          files=[]
          for x in items:
              p=x.get('path','')
              if x.get('type')=='file' and p.lower().endswith(('.parquet','.jsonl','.jsonl.gz','.csv','.csv.gz')): files.append((p,int(x.get('size') or 0)))
          files.sort()
          if not files: raise SystemExit('No dataset files found')
          json.dump({'source':repo,'license':'cc-by-nc-4.0','files':[{'path':p,'size':s} for p,s in files]},open('work/manifest.json','w'),indent=2)
          for i,(p,s) in enumerate(files,1): print(f'{i}\t{s}\t{p}')
          PY
          python - <<'PY'
          import json
          d=json.load(open('work/manifest.json'))
          with open('work/file-list.txt','w') as f:
            for i,x in enumerate(d['files'],1): f.write(f"{i}\t{x['size']}\t{x['path']}\n")
          PY
          while IFS=$'\t' read -r idx size path; do
            [ -z "$path" ] && continue
            out="work/${idx}-$(basename "$path")"
            curl -L --fail --retry 6 --retry-all-errors -o "$out" "https://huggingface.co/datasets/${SRC}/resolve/main/${path}?download=true"
            test -s "$out"
            sha=$(sha256sum "$out" | awk '{print $1}')
            bytes=$(stat -c%s "$out")
            printf '{"source":"%s","path":"%s","bytes":%s,"sha256":"%s","license":"cc-by-nc-4.0"}\n' "$SRC" "$path" "$bytes" "$sha" > "$out.manifest.json"
            gh release upload "$TAG" --repo "$REPO" "$out" "$out.manifest.json" --clobber
            rm -f "$out" "$out.manifest.json"
          done < work/file-list.txt
          gh release upload "$TAG" --repo "$REPO" work/manifest.json work/file-list.txt --clobber
          echo "K1 textbook/educational harvest completed." 
          echo "Triggered at $(date -u +%FT%TZ)"