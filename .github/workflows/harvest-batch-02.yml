name: Harvest new Indonesian datasets batch 02

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  harvest:
    if: contains(github.event.head_commit.message, '[harvest-batch-02]')
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Install dataset tooling
        run: |
          python -m pip install --upgrade pip
          pip install datasets huggingface_hub pyarrow

      - name: Harvest and package new sources
        run: |
          cat > /tmp/harvest.py <<'PY'
          import gzip, hashlib, json, os, re, shutil
          from pathlib import Path
          from datasets import load_dataset
          from huggingface_hub import snapshot_download, hf_hub_download

          ROOT=Path("/tmp/out")
          ROOT.mkdir(parents=True, exist_ok=True)

          def write_jsonl(name, rows, meta):
              out=ROOT/(name+".jsonl.gz")
              seen=set(); n=0; words=0; dropped=0
              with gzip.open(out,"wt",encoding="utf-8",compresslevel=9) as g:
                  for row in rows:
                      if not isinstance(row,dict): continue
                      text=None
                      # Prefer explicit text/content fields; otherwise choose the longest string.
                      for k in ("text","content","content_md","html","body","context","context_raw"):
                          if isinstance(row.get(k),str) and row[k].strip():
                              text=row[k].strip(); break
                      if not text:
                          vals=[v for v in row.values() if isinstance(v,str) and len(v.strip())>0]
                          if vals: text=max(vals,key=len).strip()
                      if not text or len(text)<80:
                          dropped+=1; continue
                      text=re.sub(r"\\s+"," ",text.replace("\x00"," ")).strip()
                      if len(text)<80:
                          dropped+=1; continue
                      fp=hashlib.sha1(text.encode("utf-8")).hexdigest()
                      if fp in seen: continue
                      seen.add(fp)
                      clean={"text":text,"source":meta["source"],"license":meta["license"],"lang":"id",**{k:v for k,v in row.items() if k not in {"text","content","content_md","html","body","context","context_raw","embedding","tfidf","tfidf_vector"}}}
                      g.write(json.dumps(clean,ensure_ascii=False,default=str)+"\n")
                      n+=1; words+=len(text.split())
              h=hashlib.sha256()
              with out.open("rb") as f:
                  for c in iter(lambda:f.read(1024*1024),b""): h.update(c)
              m={**meta,"output":out.name,"documents":n,"approx_words":words,"bytes":out.stat().st_size,"sha256":h.hexdigest(),"dropped":dropped}
              (ROOT/(name+".manifest.json")).write_text(json.dumps(m,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
              print(json.dumps(m,ensure_ascii=False))
              return m

          manifests=[]

          # 1) Indonesian government regulations: CC-BY-4.0, official-source-derived.
          ds=load_dataset("Azzindani/ID_REG_MD_RAG",split="train",streaming=True)
          manifests.append(write_jsonl("id-reg-md-rag-standalone",ds,{
              "source":"Azzindani/ID_REG_MD_RAG","license":"CC-BY-4.0",
              "domain":"Indonesian government regulations","provenance":"Official Indonesian regulatory repositories and government gazettes; structured Markdown/RAG derivative.",
              "not_canonical_shelf":True
          }))

          # 2) Sundanese 122M-token corpus: CC-BY-4.0.
          tr=hf_hub_download("ripkiiiii/ajnyana-corpus","train.txt",repo_type="dataset")
          va=hf_hub_download("ripkiiiii/ajnyana-corpus","val.txt",repo_type="dataset")
          def lines():
              for p in (tr,va):
                  with open(p,encoding="utf-8",errors="ignore") as f:
                      for line in f:
                          t=line.strip()
                          if t: yield {"text":t,"split":"train" if p==tr else "validation"}
          manifests.append(write_jsonl("sundanese-ajnyana-standalone",lines(),{
              "source":"ripkiiiii/ajnyana-corpus","license":"CC-BY-4.0",
              "domain":"Sundanese language","provenance":"Wikipedia Sundanese + CC-100 Sundanese; upstream reports ~122M tokens.",
              "not_canonical_shelf":True
          }))

          # 3) Public/open Javanese manuscript and literature corpus.
          snap=snapshot_download("thesimonharms/public-javanese-dataset",repo_type="dataset",allow_patterns=["**/clean/*.txt","**/clean/**/*.txt","LICENSE.md","sources.yaml"])
          def jv_lines():
              for p in Path(snap).rglob("*.txt"):
                  if "/clean/" not in str(p).replace("\\","/"): continue
                  with open(p,encoding="utf-8",errors="ignore") as f:
                      buf=[]
                      for line in f:
                          t=line.strip()
                          if t: buf.append(t)
                      if buf:
                          yield {"text":" ".join(buf),"file":str(p.relative_to(snap))}
          manifests.append(write_jsonl("javanese-public-manuscripts-standalone",jv_lines(),{
              "source":"thesimonharms/public-javanese-dataset","license":"per-source: CC0/public-domain/CC-BY-SA-3.0/GFDL",
              "domain":"Javanese / Kawi / Javanese literature","provenance":"Curated public-domain/openly licensed manuscripts, chronicles, dictionaries, grammar, stories and Wikisource materials. Per-source license must be preserved.",
              "not_canonical_shelf":True
          }))

          # 4) Kemdikbud/BSE educational raw corpus: CC-BY-4.0.
          ds=load_dataset("Firmansyah-Ibrahim/indo-bloom-raw-bse",split="train",streaming=True)
          manifests.append(write_jsonl("kemdikbud-bse-raw-standalone",ds,{
              "source":"Firmansyah-Ibrahim/indo-bloom-raw-bse","license":"CC-BY-4.0",
              "domain":"Indonesian school textbooks / BSE","provenance":"Extracted from Buku Sekolah Elektronik materials published by Kemdikbudristek; includes History, Geography, Biology, Sociology.",
              "not_canonical_shelf":True
          }))

          # 5) Indonesian Legal QA (Apache-2.0), separate from regulation text.
          ds=load_dataset("Azzindani/Indonesian_Legal_QA",split="train",streaming=True)
          manifests.append(write_jsonl("indonesian-legal-qa-standalone",ds,{
              "source":"Azzindani/Indonesian_Legal_QA","license":"Apache-2.0",
              "domain":"Indonesian legal QA","provenance":"Public Indonesian legal QA corpus.",
              "not_canonical_shelf":True
          }))

          # 6) Aksara Mega SFT (Apache-2.0).
          ds=load_dataset("AksaraLLM/aksara-mega-sft",split="train",streaming=True)
          manifests.append(write_jsonl("aksara-mega-sft-standalone",ds,{
              "source":"AksaraLLM/aksara-mega-sft","license":"Apache-2.0",
              "domain":"Indonesian/Nusantara instruction tuning","provenance":"64K+ Indonesian instruction-response pairs including regional-language and Nusantara content.",
              "not_canonical_shelf":True
          }))

          (ROOT/"BATCH-MANIFEST.json").write_text(json.dumps({
              "batch":"data-baru-batch-02-2026-09",
              "standalone":True,
              "not_K1_K2_K3_K4":True,
              "sources":manifests
          },ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
          python /tmp/harvest.py

      - name: Create standalone Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: data-baru-batch-02-2026-09
        run: |
          files=(/tmp/out/*.jsonl.gz /tmp/out/*.manifest.json /tmp/out/BATCH-MANIFEST.json)
          gh release create "$TAG" "${files[@]}"             --title "Data Baru Batch 02 — Indonesia (Standalone)"             --notes "Batch data baru yang tidak dimasukkan ke K1/K2/K3/K4. Sources: Indonesian government regulations, Supreme Court decisions, Sundanese corpus, Javanese public/open corpus, and Kemdikbud/BSE raw corpus. Provenance and per-source license are recorded in each manifest."             --latest
          gh release view "$TAG" --json name,tagName,assets,url

      - name: Remove one-shot workflow
        if: always()
        run: |
          rm -f /tmp/harvest.py
