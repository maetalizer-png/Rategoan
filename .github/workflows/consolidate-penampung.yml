name: consolidate-penampung

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    timeout-minutes: 720
    steps:
      - name: Copy all dataset assets from penampung into one release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          REPO="maetalizer-png/Rategoan"
          SRC="penampung"
          DST="data-baru-k1-k2-2026-09"
          mkdir -p work
          gh release view "$DST" --repo "$REPO" >/dev/null 2>&1 || gh release create "$DST" --repo "$REPO" --title "Data Baru K1/K2 — Consolidated — 2026-09" --notes "Consolidated dataset assets from penampung."
          gh api "repos/$REPO/releases/tags/$SRC" --jq '.assets[] | [.id,.name,.size,.digest] | @tsv' > work/assets.tsv
          n=0
          failed=0
          while IFS=$'\t' read -r id name size digest; do
            [ -z "$name" ] && continue
            case "$name" in *.md) echo "SKIP DOC $name"; continue;; esac
            n=$((n+1))
            echo "[$n] $name $size"
            rm -rf work/item && mkdir -p work/item
            if ! gh release download "$SRC" --repo "$REPO" --pattern "$name" --dir work/item --clobber; then failed=$((failed+1)); continue; fi
            file="work/item/$name"
            [ -s "$file" ] || { failed=$((failed+1)); continue; }
            actual="sha256:$(sha256sum "$file" | awk '{print $1}')"
            [ -z "$digest" ] || [ "$actual" = "$digest" ] || { echo "SHA MISMATCH $name"; failed=$((failed+1)); continue; }
            if gh release upload "$DST" --repo "$REPO" "$file" --clobber; then
              curl -fsS -X DELETE -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/releases/assets/$id" || true
              echo "MOVED $name"
            else
              failed=$((failed+1)); echo "UPLOAD FAILED $name"
            fi
            rm -f "$file"
          done < work/assets.tsv
          echo "PROCESSED=$n FAILED=$failed"
          echo "REMAINING SOURCE:"
          gh api "repos/$REPO/releases/tags/$SRC" --jq '.assets[] | [.name,.size] | @tsv' || true
          echo "DESTINATION:"
          gh api "repos/$REPO/releases/tags/$DST" --jq '.assets[] | [.name,.size] | @tsv' || true
          exit 0
