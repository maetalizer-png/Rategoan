name: harvest-k1-children-books

on:
  push:
    branches: [main]

concurrency:
  group: harvest-k1-children-books
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  harvest:
    if: contains(github.event.head_commit.message, '[harvest-k1-children-books]')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Download public HF dataset and append to existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="maetalizer-png/Rategoan"
          TAG="data-baru-k1-corpus-indonesia-2026-09"
          SRC="haznitrama/indonesian-children-books"
          mkdir -p work

          gh release view "$TAG" --repo "$REPO" >/dev/null

          python - <<'PY'
          import json, urllib.request
          repo='haznitrama/indonesian-children-books'
          u=f'https://huggingface.co/api/datasets/{repo}/tree/main?recursive=true&expand=false'
          with urllib.request.urlopen(u, timeout=120) as r: d=json.load(r)
          fs=[]
          for x in d:
              p=x.get('path','')
              if x.get('type')=='file' and p.lower().endswith(('.parquet','.jsonl','.jsonl.gz','.csv','.csv.gz')):
                  fs.append((p,int(x.get('size') or 0)))
          if not fs: raise SystemExit('No text data files found')
          with open('work/files.json','w') as f: json.dump({'source':repo,'license':'cc-by-nc-4.0','files':[{'path':p,'size':s} for p,s in fs]},f,indent=2)
          for p,s in fs: print(s,p)
          PY

          while IFS=$'\t' read -r path size; do
            [ -z "$path" ] && continue
            base=$(basename "$path")
            safe=$(printf '%s' "$base" | tr '/ ' '__')
            out="work/children-${safe}"
            curl -L --fail --retry 6 --retry-all-errors -o "$out" "https://huggingface.co/datasets/haznitrama/indonesian-children-books/resolve/main/$path?download=true"
            test -s "$out"
            sha=$(sha256sum "$out" | awk '{print $1}')
            bytes=$(stat -c%s "$out")
            printf '{"source":"%s","path":"%s","bytes":%s,"sha256":"%s","license":"cc-by-nc-4.0"}\n' "$SRC" "$path" "$bytes" "$sha" > "$out.manifest.json"
            gh release upload "$TAG" --repo "$REPO" "$out" "$out.manifest.json" --clobber
            rm -f "$out" "$out.manifest.json"
          done < <(python - <<'PY'
          import json
          for x in json.load(open('work/files.json'))['files']:
              print(x['path']+'\t'+str(x['size']))
          PY
          )

          gh release upload "$TAG" --repo "$REPO" work/files.json --clobber
          echo 'DONE: Indonesian children books appended to existing K1 data release.'
