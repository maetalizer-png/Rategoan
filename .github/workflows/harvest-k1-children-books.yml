name: harvest-k1-children-books

on:
  push:
    branches: [main]

concurrency:
  group: harvest-k1-children-books
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Download public HF dataset and append to existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="maetalizer-png/Rategoan"
          TAG="data-baru-k1-corpus-indonesia-2026-09"
          SRC="haznitrama/indonesian-children-books"
          mkdir -p work
          gh release view "$TAG" --repo "$REPO" >/dev/null
          python - <<'PY'
          import json, urllib.request
          repo='haznitrama/indonesian-children-books'
          u=f'https://huggingface.co/api/datasets/{repo}/tree/main?recursive=true&expand=false'
          with urllib.request.urlopen(u, timeout=120) as r: d=json.load(r)
          fs=[(x.get('path',''),int(x.get('size') or 0)) for x in d if x.get('type')=='file' and x.get('path','').lower().endswith(('.parquet','.jsonl','.jsonl.gz','.csv','.csv.gz'))]
          if not fs: raise SystemExit('No text data files found')
          json.dump({'source':repo,'license':'cc-by-nc-4.0','files':[{'path':p,'size':s} for p,s in fs]},open('work/files.json','w'),indent=2)
          print('HF files:',len(fs),'bytes:',sum(s for _,s in fs))
          for p,s in fs: print(s,p)
          PY
          python - <<'PY' > work/list.tsv
          import json
          for x in json.load(open('work/files.json'))['files']: print(x['path']+'\t'+str(x['size']))
          PY
          while IFS=$'\t' read -r path size; do
            [ -z "$path" ] && continue
            safe=$(printf '%s' "$(basename "$path")" | tr '/ ' '__')
            out="work/children-${safe}"
            echo "Downloading $path ($size bytes)"
            curl -L --fail --retry 8 --retry-all-errors -o "$out" "https://huggingface.co/datasets/haznitrama/indonesian-children-books/resolve/main/$path?download=true"
            test -s "$out"
            sha=$(sha256sum "$out" | awk '{print $1}')
            bytes=$(stat -c%s "$out")
            printf '{"source":"%s","path":"%s","bytes":%s,"sha256":"%s","license":"cc-by-nc-4.0"}\n' "$SRC" "$path" "$bytes" "$sha" > "$out.manifest.json"
            gh release upload "$TAG" --repo "$REPO" "$out" "$out.manifest.json" --clobber
            rm -f "$out" "$out.manifest.json"
          done < work/list.tsv
          gh release upload "$TAG" --repo "$REPO" work/files.json --clobber
          echo 'DONE: Indonesian children books appended to existing K1 data release.'

      - name: Download large DeepClean Indo4B from Hugging Face and append to same release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="maetalizer-png/Rategoan"
          TAG="data-baru-k1-corpus-indonesia-2026-09"
          URL="https://huggingface.co/datasets/img-gemina/indonesian-corpus-2b-deepclean-indo4b/resolve/main/indonesian_corpus_1p8b_deepclean_indo4b.jsonl.gz?download=true"
          mkdir -p work/indo4b
          curl -L --fail --retry 8 --retry-all-errors -o work/indo4b/source.jsonl.gz "$URL"
          test -s work/indo4b/source.jsonl.gz
          sha256sum work/indo4b/source.jsonl.gz > work/indo4b/source.sha256
          split -b 1800M -d -a 2 work/indo4b/source.jsonl.gz work/indo4b/indo4b.part.
          cat > work/indo4b/manifest.txt <<'EOF'
Source: img-gemina/indonesian-corpus-2b-deepclean-indo4b
Artifact: indonesian_corpus_1p8b_deepclean_indo4b.jsonl.gz
Tokens: 1,801,814,049
Documents: 25,553,595
Source size: 4.76 GB
License: CC-BY-4.0
Reassembly: cat indo4b.part.* > indonesian_corpus_1p8b_deepclean_indo4b.jsonl.gz
SHA256: see source.sha256
EOF
          gh release upload "$TAG" --repo "$REPO" work/indo4b/indo4b.part.* work/indo4b/source.sha256 work/indo4b/manifest.txt --clobber
          echo 'DONE: DeepClean Indo4B appended to existing K1 release.'