name: harvest-k1-children-books

on:
  push:
    branches: [main]

concurrency:
  group: harvest-k1-children-books
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Download public HF dataset and append to existing penampung release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="maetalizer-png/Rategoan"
          TAG="penampung"
          SRC="haznitrama/indonesian-children-books"
          mkdir -p work
          gh release view "$TAG" --repo "$REPO" >/dev/null
          python - <<'PY'
          import json, urllib.request
          repo='haznitrama/indonesian-children-books'
          u=f'https://huggingface.co/api/datasets/{repo}/tree/main?recursive=true&expand=false'
          with urllib.request.urlopen(u, timeout=120) as r: d=json.load(r)
          fs=[(x.get('path',''),int(x.get('size') or 0)) for x in d if x.get('type')=='file' and x.get('path','').lower().endswith(('.parquet','.jsonl','.jsonl.gz','.csv','.csv.gz'))]
          if not fs: raise SystemExit('No text data files found')
          json.dump({'source':repo,'license':'cc-by-nc-4.0','files':[{'path':p,'size':s} for p,s in fs]},open('work/files.json','w'),indent=2)
          print('HF files:',len(fs),'bytes:',sum(s for _,s in fs))
          for p,s in fs: print(s,p)
          PY
          python - <<'PY' > work/list.tsv
          import json
          for x in json.load(open('work/files.json'))['files']: print(x['path']+'\t'+str(x['size']))
          PY
          while IFS=$'\t' read -r path size; do
            [ -z "$path" ] && continue
            safe=$(printf '%s' "$(basename "$path")" | tr '/ ' '__')
            out="work/children-${safe}"
            echo "Downloading $path ($size bytes)"
            curl -L --fail --retry 8 --retry-all-errors -o "$out" "https://huggingface.co/datasets/haznitrama/indonesian-children-books/resolve/main/$path?download=true"
            test -s "$out"
            sha256sum "$out" > "$out.sha256"
            bytes=$(stat -c%s "$out")
            printf '{"source":"%s","path":"%s","bytes":%s,"sha256_file":"%s","license":"cc-by-nc-4.0","status":"raw candidate; not yet merged into K1"}\n' "$SRC" "$path" "$bytes" "$(cut -d' ' -f1 "$out.sha256")" > "$out.manifest.json"
            gh release upload "$TAG" --repo "$REPO" "$out" "$out.manifest.json" "$out.sha256" --clobber
            rm -f "$out" "$out.manifest.json" "$out.sha256"
          done < work/list.tsv
          gh release upload "$TAG" --repo "$REPO" work/files.json --clobber
          echo 'DONE: Indonesian children books appended to penampung.'
