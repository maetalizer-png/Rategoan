name: consolidate-k1

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: maetalizer-png/Rategoan
      TARGET: data-baru-k1-corpus-indonesia-2026-09
    steps:
      - name: Consolidate existing data-baru assets
        shell: bash
        run: |
          set -euo pipefail
          case "${{ github.event.head_commit.message }}" in
            *"[consolidate-k1]"*) ;;
            *) echo "not a consolidation commit"; exit 0 ;;
          esac
          mkdir -p /tmp/rategoan-consolidate
          sources=(
            data-baru-xone-parallel-en-id-2026-09
            data-baru-k1-txtperpus-2026-09
            data-baru-k1-indmix-2026-09
            data-baru-k1-aikathata-dfk-2026-09
          )
          for tag in "${sources[@]}"; do
            echo "=== $tag ==="
            page=1
            while true; do
              json="/tmp/rategoan-consolidate/assets.json"
              gh api "/repos/$REPO/releases/tags/$tag/assets?per_page=100&page=$page" > "$json"
              count=$(jq 'length' "$json")
              [ "$count" -gt 0 ] || break
              for row in $(jq -r '.[] | @base64' "$json"); do
                asset=$(printf '%s' "$row" | base64 -d)
                name=$(printf '%s' "$asset" | jq -r '.name')
                size=$(printf '%s' "$asset" | jq -r '.size')
                url=$(printf '%s' "$asset" | jq -r '.browser_download_url')
                out="${tag}__${name}"
                file="/tmp/rategoan-consolidate/$out"
                echo "COPY $tag / $name / $size bytes"
                curl -L --fail --retry 8 --retry-all-errors -o "$file" "$url"
                actual=$(stat -c%s "$file")
                test "$actual" = "$size"
                gh release upload "$TARGET" --repo "$REPO" "$file" --clobber
                rm -f "$file"
              done
              [ "$count" -lt 100 ] && break
              page=$((page+1))
            done
          done
          gh api "/repos/$REPO/releases/tags/$TARGET" > /tmp/rategoan-consolidate/target.json
          jq '{tag:.tag_name,assets:(.assets|length),bytes:(.assets|map(.size)|add)}' /tmp/rategoan-consolidate/target.json
          echo "CONSOLIDATION_COMPLETE"
          echo "RUN_MARKER=consolidate-k1"
