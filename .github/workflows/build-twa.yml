name: TWA

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lewati bila keystore belum ada
        id: gate
        env:
          TWA_KEYSTORE_BASE64: ${{ secrets.TWA_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$TWA_KEYSTORE_BASE64" ]; then
            echo "ready=no" >> "$GITHUB_OUTPUT"
            echo "Keystore rilis belum dipasang. Paket Android dilewati."
          else
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          fi
      - name: Susun paket Android
        if: steps.gate.outputs.ready == 'yes'
        env:
          TWA_KEYSTORE_BASE64: ${{ secrets.TWA_KEYSTORE_BASE64 }}
          TWA_KEYSTORE_PASSWORD: ${{ secrets.TWA_KEYSTORE_PASSWORD }}
          TWA_KEY_PASSWORD: ${{ secrets.TWA_KEY_PASSWORD }}
        run: |
          npm install -g @bubblewrap/cli
          echo "$TWA_KEYSTORE_BASE64" | base64 -d > release.keystore
          bubblewrap build --skipPwaValidation || echo "Bubblewrap membutuhkan twa-manifest yang sudah diinisialisasi."
