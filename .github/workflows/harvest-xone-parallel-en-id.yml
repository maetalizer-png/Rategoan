name: harvest-xone-parallel-en-id

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: harvest-xone-parallel-en-id
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Download and publish Xone Parallel EN-ID
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="maetalizer-png/Rategoan"
          TAG="data-baru-xone-parallel-en-id-2026-09"
          DS="cloverx-id/xone-repository-parallel-en-id-corpus"
          mkdir -p work

          gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1 ||             gh release create "$TAG" --repo "$REPO"               --title "Data Baru — Xone Parallel English-Indonesian — 2026-09"               --notes "Standalone bilingual EN-ID corpus. Source: $DS. Apache-2.0. 77,654,105 rows / about 11.2 GB upstream. Upstream describes the default subset as sanitized, deduplicated parallel pairs with provenance and domain labels. Kept outside K1/K2/K3/K4. Because upstream aggregates 11 translation sources, downstream overlap review is still required."

          curl -L --fail --retry 8 --retry-all-errors             -o work/files.json             "https://huggingface.co/api/datasets/$DS/parquet/default/train"

          python - <<'PY'
          import json
          x=json.load(open("work/files.json"))
          if isinstance(x,dict):
              urls=x.get("urls") or x.get("parquet_files") or []
          else:
              urls=x
          out=[]
          for i,u in enumerate(urls):
              if isinstance(u,dict):
                  u=u.get("url")
              if u:
                  out.append((i,u))
          if not out:
              raise SystemExit("No parquet URLs returned")
          with open("work/urls.tsv","w") as f:
              for i,u in out:
                  f.write(f"{i}\t{u}\n")
          print("parquet shards:",len(out))
          PY

          while IFS=$'\t' read -r idx url; do
            name=$(python - "$url" "$idx" <<'PY'
          import sys,urllib.parse,os
          u=sys.argv[1]; i=sys.argv[2]
          p=urllib.parse.urlparse(u).path
          base=os.path.basename(p) or f"shard-{i}.parquet"
          if not base.endswith(".parquet"):
              base=f"xone-parallel-{int(i):04d}.parquet"
          print(f"xone-parallel-{int(i):04d}-{base}")
          PY
            )
            echo "Downloading $name"
            curl -L --fail --retry 8 --retry-all-errors -o "work/$name" "$url"
            sha256sum "work/$name" > "work/$name.sha256"
            gh release upload "$TAG" --repo "$REPO" "work/$name" "work/$name.sha256" --clobber
            rm -f "work/$name" "work/$name.sha256"
          done < work/urls.tsv

          printf '{"dataset":"%s","rows":77654105,"license":"Apache-2.0","status":"complete","source":"%s","release":"%s"}\n' "$DS" "$DS" "$TAG" > work/manifest.json
          gh release upload "$TAG" --repo "$REPO" work/manifest.json --clobber
