name: harvest-k1-large-corpus

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  harvest:
    if: contains(github.event.head_commit.message, '[harvest-k1-science]')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Download large scientific EN-ID corpus from Hugging Face
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="maetalizer-png/Rategoan"
          TAG="data-baru-k1-corpus-indonesia-2026-09"
          SRC="Ik45/data-science-en-id"
          mkdir -p work
          gh release view "$TAG" --repo "$REPO" >/dev/null
          python -m pip install -q -U huggingface_hub
          hf download "$SRC" --repo-type dataset --local-dir work/science
          find work/science -type f -size +0c -print0 | while IFS= read -r -d '' f; do
            rel=${f#work/science/}
            safe=$(printf '%s' "$rel" | tr '/' '__' | tr ' ' '_')
            size=$(stat -c%s "$f")
            if [ "$size" -lt 1900000000 ]; then
              sha256sum "$f" > "$f.sha256"
              cp "$f" "work/$safe"
              cp "$f.sha256" "work/$safe.sha256"
              gh release upload "$TAG" --repo "$REPO" "work/$safe" "work/$safe.sha256" --clobber
            else
              split -b 1800m -d -a 3 "$f" "${f}.part-"
              for p in "${f}".part-*; do psafe=$(printf "%s" "${p#work/science/}" | tr "/" "__" | tr " " "_"); sha256sum "$p" > "$p.sha256"; cp "$p" "work/$psafe"; cp "$p.sha256" "work/$psafe.sha256"; gh release upload "$TAG" --repo "$REPO" "work/$psafe" "work/$psafe.sha256" --clobber; done
            fi
          done
          printf '%s\n' \
            'source=Ik45/data-science-en-id' \
            'size=3.04 GB' \
            'rows=13,494,098' \
            'license=MIT' \
            'domain=scientific/data-science/AI/ML EN-ID' \
            'note=Derived from science-focused Wikipedia and arXiv subsets; deduplicated and normalized upstream.' \
            > work/ik45-manifest.txt
          gh release upload "$TAG" --repo "$REPO" work/ik45-manifest.txt --clobber
          echo "K1 scientific corpus harvest completed."
