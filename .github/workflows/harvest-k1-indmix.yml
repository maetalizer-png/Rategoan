name: Harvest K1 IndMix
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/harvest-k1-indmix.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Harvest AdaMLLab/IndMix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="maetalizer-png/Rategoan"
          TAG="data-baru-k1-indmix-2026-09"
          SRC="AdaMLLab/IndMix"
          mkdir -p work
          gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1 || gh release create "$TAG" --repo "$REPO" --title "Data Baru K1 — IndMix — 2026-09" --notes "Standalone K1 candidate. Source: AdaMLLab/IndMix on Hugging Face. Kept outside canonical K1 pending cleaning/deduplication/overlap audit."
          python - <<'PY'
          import json, urllib.request
          api="https://huggingface.co/api/datasets/AdaMLLab/IndMix/tree/main?recursive=true&expand=false"
          with urllib.request.urlopen(api, timeout=120) as r:
              items=json.load(r)
          files=[]
          for x in items:
              p=x.get("path","")
              if x.get("type")=="file" and p.lower().endswith((".parquet",".jsonl",".jsonl.gz",".csv",".csv.gz")):
                  files.append((p,int(x.get("size") or 0)))
          files.sort()
          if not files: raise SystemExit("No corpus files found")
          total=sum(s for _,s in files)
          json.dump({"repo":"AdaMLLab/IndMix","files":files,"total_bytes":total},open("work/files.json","w"),indent=2)
          print("FILES",len(files),"TOTAL_BYTES",total)
          for p,s in files: print(s,p)
          PY
          python - <<'PY'
          import json
          d=json.load(open("work/files.json"))
          with open("work/file-list.txt","w") as f:
              for i,(p,s) in enumerate(d["files"],1): f.write(f"{i}\t{s}\t{p}\n")
          PY
          while IFS=$'\t' read -r idx size path; do
            [ -z "$path" ] && continue
            safe=$(printf '%s' "$path" | tr '/ ' '__' | tr -cd '[:alnum:]_.-')
            out="work/$idx-$safe"
            curl -L --fail --retry 6 --retry-all-errors -o "$out" "https://huggingface.co/datasets/$SRC/resolve/main/$path?download=true"
            test -s "$out"
            bytes=$(stat -c%s "$out")
            [ "$bytes" -eq "$size" ] || { echo "SIZE MISMATCH $path expected=$size got=$bytes"; exit 1; }
            sha=$(sha256sum "$out" | awk '{print $1}')
            printf '{"source":"%s","path":"%s","bytes":%s,"sha256":"%s"}\n' "$SRC" "$path" "$bytes" "$sha" > "$out.manifest.json"
            gh release upload "$TAG" --repo "$REPO" "$out" "$out.manifest.json" --clobber
            rm -f "$out" "$out.manifest.json"
          done < work/file-list.txt
          gh release upload "$TAG" --repo "$REPO" work/files.json work/file-list.txt --clobber
          echo "HARVEST_COMPLETE"
