name: move-penampung-to-data-baru

on:
  push:
    branches: [main]

concurrency:
  group: move-penampung-to-data-baru
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  move:
    if: contains(github.event.head_commit.message, '[move-penampung]')
    runs-on: ubuntu-latest
    timeout-minutes: 720
    steps:
      - name: Consolidate every dataset asset from penampung
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          REPO="maetalizer-png/Rategoan"
          SRC="penampung"
          DST="data-baru-k1-k2-2026-09"
          mkdir -p work

          gh release view "$DST" --repo "$REPO" >/dev/null 2>&1 || gh release create "$DST" --repo "$REPO" \
            --title "Data Baru K1/K2 — Consolidated — 2026-09" \
            --notes "Single consolidated release for new data harvested into the Penampung. Documentation is excluded; dataset assets are copied with SHA-256 verification."

          gh api "repos/$REPO/releases/tags/$SRC" --jq '.assets[] | [.id,.name,.size,.digest] | @tsv' > work/assets.tsv
          total=$(wc -l < work/assets.tsv)
          done_n=0
          failed=0

          while IFS=$'\t' read -r id name size digest; do
            [ -z "$name" ] && continue
            case "$name" in
              PRD-GROK-BUILD.md|*.md) echo "SKIP DOCUMENT: $name"; continue ;;
            esac
            done_n=$((done_n+1))
            echo "[$done_n/$total] COPYING $name ($size bytes)"
            rm -rf work/item && mkdir -p work/item
            if ! gh release download "$SRC" --repo "$REPO" --pattern "$name" --dir work/item --clobber; then
              echo "DOWNLOAD FAILED: $name"; failed=$((failed+1)); continue
            fi
            file="work/item/$name"
            if [ ! -s "$file" ]; then
              echo "EMPTY/MISSING: $name"; failed=$((failed+1)); continue
            fi
            actual="sha256:$(sha256sum "$file" | awk '{print $1}')"
            if [ -n "$digest" ] && [ "$actual" != "$digest" ]; then
              echo "SHA MISMATCH: $name expected=$digest actual=$actual"; failed=$((failed+1)); continue
            fi
            if ! gh release upload "$DST" --repo "$REPO" "$file" --clobber; then
              echo "UPLOAD FAILED: $name"; failed=$((failed+1)); continue
            fi
            echo "UPLOADED: $name"
            if curl -fsS -X DELETE \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/releases/assets/$id"; then
              echo "REMOVED FROM PENAMPUNG: $name"
            else
              echo "SOURCE DELETE FAILED (data safe in destination): $name"
              failed=$((failed+1))
            fi
            rm -f "$file"
          done < work/assets.tsv

          echo "=== CONSOLIDATION COMPLETE: processed=$done_n failed=$failed ==="
          echo "=== REMAINING PENAMPUNG ASSETS ==="
          gh api "repos/$REPO/releases/tags/$SRC" --jq '.assets[] | [.name,.size] | @tsv' || true
          echo "=== CONSOLIDATED DESTINATION ==="
          gh api "repos/$REPO/releases/tags/$DST" --jq '.assets[] | [.name,.size] | @tsv' || true
          exit 0

# trigger move-penampung-2026-09-30-0746
