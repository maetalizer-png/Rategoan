name: Harvest K1 Coding — Cocktail 6B

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/harvest-k1-coding-cocktail.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Download code corpus from Hugging Face
        env:
          HF_URL: https://huggingface.co/datasets/MinimaML/cocktail-6b/resolve/main/code_6B.bin?download=true
        run: |
          set -euo pipefail
          mkdir -p work
          curl -L --fail --retry 5 --retry-delay 5 -o work/code_6B.bin "$HF_URL"
          test -s work/code_6B.bin
          stat -c '%n %s bytes' work/code_6B.bin
          sha256sum work/code_6B.bin > work/SHA256SUMS.txt

      - name: Write manifest
        run: |
          cat > work/manifest.json <<'JSON'
          {
            "dataset": "MinimaML/cocktail-6b",
            "source_file": "code_6B.bin",
            "purpose": "coding corpus candidate",
            "license": "Apache-2.0",
            "source_url": "https://huggingface.co/datasets/MinimaML/cocktail-6b",
            "notes": "Code component only. Dataset card describes this file as programming-language data; the full dataset also contains foundation and logic components."
          }
          JSON

      - name: Create or reuse release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: data-baru-k1-coding-cocktail-2026-09
          TITLE: Data Baru K1 — Coding — Cocktail 6B — 2026-09
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --notes "K1 candidate: coding corpus from MinimaML/cocktail-6b. Source license: Apache-2.0. Code component kept separate pending later cleaning/deduplication/audit."
          fi
          gh release upload "$TAG" work/code_6B.bin work/manifest.json work/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber

      - name: Verify release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: data-baru-k1-coding-cocktail-2026-09
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY"
