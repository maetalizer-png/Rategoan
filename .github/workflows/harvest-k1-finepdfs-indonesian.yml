name: harvest-k1-finepdfs-indonesian

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  harvest:
    if: contains(github.event.head_commit.message, '[harvest-k1-finepdfs]')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Harvest Indonesian FinePDFs into existing K1 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="maetalizer-png/Rategoan"
          TAG="data-baru-k1-corpus-indonesia-2026-09"
          BASE="https://huggingface.co/datasets/HuggingFaceFW/finepdfs/resolve/main"
          API="https://huggingface.co/api/datasets/HuggingFaceFW/finepdfs/tree/main?path=data/ind_Latn/train&recursive=true&expand=false"
          mkdir -p work
          gh release view "$TAG" --repo "$REPO" >/dev/null

          python - <<'PY'
          import json, urllib.request
          api="https://huggingface.co/api/datasets/HuggingFaceFW/finepdfs/tree/main?path=data/ind_Latn/train&recursive=true&expand=false"
          with urllib.request.urlopen(api, timeout=120) as r:
              items=json.load(r)
          files=[]
          for x in items:
              p=x.get('path','')
              if x.get('type')=='file' and p.endswith('.parquet'):
                  files.append({'path':p,'size':int(x.get('size') or 0)})
          files.sort(key=lambda x:x['path'])
          if not files: raise SystemExit('No Indonesian FinePDFs parquet shards found')
          total=sum(x['size'] for x in files)
          manifest={'source':'HuggingFaceFW/finepdfs','subset':'ind_Latn','split':'train','license':'ODC-By-1.0','files':files,'reported_tokens':20318872038,'reported_documents':2323354,'reported_disk_bytes':19650000000}
          json.dump(manifest,open('work/finepdfs-ind-Latn-manifest.json','w'),indent=2)
          open('work/finepdfs-ind-Latn-filelist.tsv','w').write(''.join(f"{i+1}\t{x['size']}\t{x['path']}\n" for i,x in enumerate(files)))
          print('SHARDS',len(files),'BYTES',total)
          PY

          gh release upload "$TAG" --repo "$REPO" work/finepdfs-ind-Latn-manifest.json work/finepdfs-ind-Latn-filelist.tsv --clobber

          while IFS=$'\t' read -r idx size path; do
            [ -z "$path" ] && continue
            name=$(basename "$path")
            out="work/${idx}-${name}"
            curl -L --fail --retry 8 --retry-all-errors --retry-delay 3 -o "$out" "$BASE/$path?download=true"
            test -s "$out"
            bytes=$(stat -c%s "$out")
            sha=$(sha256sum "$out" | awk '{print $1}')
            printf '{"source":"HuggingFaceFW/finepdfs","subset":"ind_Latn","path":"%s","bytes":%s,"sha256":"%s","license":"ODC-By-1.0"}\n' "$path" "$bytes" "$sha" > "$out.manifest.json"
            gh release upload "$TAG" --repo "$REPO" "$out" "$out.manifest.json" --clobber
            rm -f "$out" "$out.manifest.json"
            echo "DONE_SHARD=$idx SIZE=$bytes PATH=$path"
          done < work/finepdfs-ind-Latn-filelist.tsv

          echo "FINEPDFS INDONESIAN 20B TOKEN HARVEST COMPLETE"
