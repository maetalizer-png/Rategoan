name: harvest-k1-finepdfs-indonesian

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  harvest:
    if: contains(github.event.head_commit.message, '[harvest-k1-finepdfs]')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Harvest Indonesian FinePDFs into existing K1 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="maetalizer-png/Rategoan"
          TAG="data-baru-k1-corpus-indonesia-2026-09"
          mkdir -p work
          gh release view "$TAG" --repo "$REPO" >/dev/null
          python -m pip install -q 'huggingface_hub[hf_transfer]'
          export HF_HUB_ENABLE_HF_TRANSFER=1

          python - <<'PY'
          import json, os
          from huggingface_hub import HfApi
          api=HfApi()
          repo='HuggingFaceFW/finepdfs'
          files=[]
          for x in api.list_repo_tree(repo, path='data/ind_Latn/train', recursive=True):
              p=getattr(x,'path','')
              if getattr(x,'type',None)=='file' and p.endswith('.parquet'):
                  files.append({'path':p,'size':int(getattr(x,'size',0) or 0)})
          files.sort(key=lambda x:x['path'])
          if not files:
              raise SystemExit('No Indonesian FinePDFs parquet shards found under data/ind_Latn/train')
          total=sum(x['size'] for x in files)
          manifest={'source':repo,'subset':'ind_Latn','split':'train','license':'ODC-By-1.0','files':files,'reported_tokens':20318872038,'reported_documents':2323354,'reported_disk_bytes':19650000000}
          json.dump(manifest,open('work/finepdfs-ind-Latn-manifest.json','w'),indent=2)
          with open('work/finepdfs-ind-Latn-filelist.tsv','w') as f:
              for i,x in enumerate(files,1): f.write(f"{i}\t{x['size']}\t{x['path']}\n")
          print('SHARDS',len(files),'BYTES',total)
          PY

          gh release upload "$TAG" --repo "$REPO" work/finepdfs-ind-Latn-manifest.json work/finepdfs-ind-Latn-filelist.tsv --clobber

          while IFS=$'\t' read -r idx size path; do
            [ -z "$path" ] && continue
            python - "$path" "$idx" <<'PY'
          import os, sys, hashlib
          from huggingface_hub import hf_hub_download
          path=sys.argv[1]; idx=sys.argv[2]
          local=hf_hub_download(repo_id='HuggingFaceFW/finepdfs',filename=path,repo_type='dataset',local_dir='work/hf',local_dir_use_symlinks=False)
          out=f"work/{idx}-"+path.rsplit('/',1)[-1]
          os.replace(local,out)
          h=hashlib.sha256()
          with open(out,'rb') as f:
              for chunk in iter(lambda:f.read(1024*1024),b''): h.update(chunk)
          with open(out+'.manifest.json','w') as f:
              f.write('{"source":"HuggingFaceFW/finepdfs","subset":"ind_Latn","path":'+repr(path).replace("'",'"')+',"bytes":'+str(os.path.getsize(out))+',"sha256":"'+h.hexdigest()+'","license":"ODC-By-1.0"}')
          print('DOWNLOADED',out,os.path.getsize(out))
          PY
            out=$(find work -maxdepth 1 -type f -name "${idx}-*.parquet" | head -1)
            test -n "$out" || { echo "missing downloaded shard $idx"; exit 3; }
            bytes=$(stat -c%s "$out")
            if [ "$bytes" -gt 1900000000 ]; then
              split -b 1800M -d -a 3 "$out" "${out}.part-"
              for p in "${out}.part-"*; do gh release upload "$TAG" --repo "$REPO" "$p" --clobber; done
            else
              gh release upload "$TAG" --repo "$REPO" "$out" "$out.manifest.json" --clobber
            fi
            rm -f "$out" "$out.manifest.json"
            echo "DONE_SHARD=$idx SIZE=$bytes PATH=$path"
          done < work/finepdfs-ind-Latn-filelist.tsv

          echo "FINEPDFS INDONESIAN 20B TOKEN HARVEST COMPLETE"
