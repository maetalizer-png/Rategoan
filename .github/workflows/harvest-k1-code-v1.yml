name: harvest-k1-code-v1

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  harvest:
    if: contains(github.event.head_commit.message, '[harvest-code-v1]')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Download and publish code-v1 into existing K1 data release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="maetalizer-png/Rategoan"
          TAG="data-baru-k1-corpus-indonesia-2026-09"
          HF_REPO="owenqwenllmwine/code-v1"
          mkdir -p work
          python - <<'PY'
          import subprocess, sys, json
          try:
              from huggingface_hub import HfApi
          except ImportError:
              subprocess.check_call([sys.executable, "-m", "pip", "install", "-q", "huggingface_hub"])
              from huggingface_hub import HfApi
          api=HfApi()
          rows=[]
          for x in api.list_repo_tree(HF_REPO, repo_type="dataset", recursive=True):
              path=getattr(x,"path",None)
              size=getattr(x,"size",None)
              if path and getattr(x,"type",None)=="file" and path.endswith((".jsonl",".jsonl.gz",".parquet",".txt",".txt.gz")):
                  if size is None:
                      raise RuntimeError(f"Missing size for {path}")
                  rows.append({"path":path,"size":int(size)})
          rows.sort(key=lambda z:z["path"])
          if not rows:
              raise RuntimeError("No code-v1 data files found")
          total=sum(x["size"] for x in rows)
          print("FILES",len(rows),"BYTES",total)
          json.dump({"repo":HF_REPO,"ref":"main","files":rows,"total_bytes":total},open("work/code-v1-files.json","w"),indent=2)
          PY
          gh release view "$TAG" --repo "$REPO" >/dev/null
          gh release upload "$TAG" --repo "$REPO" work/code-v1-files.json --clobber
          python - <<'PY'
          import json
          d=json.load(open("work/code-v1-files.json"))
          with open("work/list.tsv","w") as f:
              for i,x in enumerate(d["files"],1):
                  print(i,x["size"],x["path"],sep="\t",file=f)
          PY
          while IFS=$'\t' read -r idx size path; do
            safe=$(printf "%s" "$path" | sed 's#[^A-Za-z0-9._-]#_#g')
            out="work/code-v1-$idx-$safe"
            echo "DOWNLOADING $idx $path expected=$size"
            curl -L --fail --retry 8 --retry-all-errors -o "$out" "https://huggingface.co/datasets/$HF_REPO/resolve/main/$path?download=true"
            actual=$(stat -c%s "$out")
            if [ "$actual" -ne "$size" ]; then
              echo "SIZE_MISMATCH path=$path expected=$size actual=$actual"
              exit 1
            fi
            sha=$(sha256sum "$out" | awk '{print $1}')
            printf '{"source":"%s","ref":"main","path":"%s","bytes":%s,"sha256":"%s"}\n' "$HF_REPO" "$path" "$actual" "$sha" > "$out.manifest.json"
            gh release upload "$TAG" --repo "$REPO" "$out" "$out.manifest.json" --clobber
            rm -f "$out" "$out.manifest.json"
          done < work/list.tsv
          gh release view "$TAG" --repo "$REPO" --json assets --jq '{asset_count:(.assets|length),bytes:(.assets|map(.size)|add)}' | tee work/code-v1-release-summary.json
          gh release upload "$TAG" --repo "$REPO" work/code-v1-release-summary.json --clobber
          echo "CODE_V1_HARVEST_DONE"
