name: harvest-k1-textbooks-final

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: maetalizer-png/Rategoan
      TAG: data-baru-k1-corpus-indonesia-2026-09
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - name: Harvest Indonesian STEM and Non-STEM textbooks
        run: |
          set -euo pipefail
          test -n "${HF_TOKEN:-}" || { echo "HF_TOKEN secret missing"; exit 2; }
          gh release view "$TAG" --repo "$REPO" >/dev/null
          python - <<'PY'
import json, os, urllib.request
token=os.environ["HF_TOKEN"]
repos=["InfoBayAI/Indonesian-STEM-Textbook-Dataset","InfoBayAI/Indonesian-Non-STEM-Textbook-Dataset"]
os.makedirs("work",exist_ok=True)
for repo in repos:
    req=urllib.request.Request(
      f"https://huggingface.co/api/datasets/{repo}/tree/main?recursive=true&expand=false",
      headers={"Authorization":f"Bearer {token}"})
    with urllib.request.urlopen(req,timeout=180) as r: items=json.load(r)
    files=[(x["path"],int(x.get("size") or 0)) for x in items
           if x.get("type")=="file" and x.get("path","").lower().endswith((".parquet",".jsonl",".jsonl.gz",".csv",".csv.gz",".txt",".txt.gz"))]
    if not files: raise SystemExit("NO FILES "+repo)
    safe=repo.replace("/","__")
    json.dump({"repo":repo,"files":files,"total_bytes":sum(s for _,s in files)},open(f"work/{safe}.json","w"),indent=2)
    print("FOUND",repo,len(files),sum(s for _,s in files))
PY
          for meta in work/*.json; do
            gh release upload "$TAG" --repo "$REPO" "$meta" --clobber
          done
          python - <<'PY'
import json,glob
with open("work/download.tsv","w") as out:
  for mf in glob.glob("work/InfoBayAI__*.json"):
    d=json.load(open(mf)); safe=d["repo"].replace("/","__")
    for i,(p,s) in enumerate(d["files"],1): out.write(f"{d['repo']}\t{safe}\t{i}\t{s}\t{p}\n")
PY
          while IFS=$'\t' read -r repo safe idx expected path; do
            encoded=$(python -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1],safe="/"))' "$path")
            out="work/$safe-$idx-$(basename "$path")"
            echo "GET $repo/$path -> $out ($expected)"
            curl -L --fail --retry 8 --retry-all-errors -H "Authorization: Bearer $HF_TOKEN" -o "$out" "https://huggingface.co/datasets/$repo/resolve/main/$encoded?download=true"
            actual=$(stat -c%s "$out")
            test "$actual" -eq "$expected"
            sha256sum "$out" > "$out.sha256"
            gh release upload "$TAG" --repo "$REPO" "$out" "$out.sha256" --clobber
            rm -f "$out" "$out.sha256"
          done < work/download.tsv
          echo "DONE TEXTBOOKS IN $TAG"
