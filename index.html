<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <title>Kesempatan OS</title>
  <link rel="icon" href="icon.svg">
  <link rel="stylesheet" href="os/os.css">
</head>
<body>
  <div id="os">
    <header class="bar">
      <div class="mark">KESENPATAN OS</div>
      <div class="bar-right">AGENTIC</div>
    </header>

    <section class="rail" aria-label="Alur kerja">
      <div class="step" data-step="pahami">1 Pahami</div>
      <div class="step" data-step="rencana">2 Rencana</div>
      <div class="step" data-step="kerja">3 Kerja</div>
      <div class="step" data-step="lapor">4 Lapor</div>
    </section>

    <main class="board">
      <ol id="log" class="log"></ol>
    </main>

    <form id="composer" class="composer" autocomplete="off">
      <input id="goal" name="goal" maxlength="500" placeholder="Tulis satu tujuan. Satu kerjaan." required>
      <button type="submit">JALANKAN</button>
    </form>
  </div>
  <script src="os/os.js"></script>
</body>
</html>
