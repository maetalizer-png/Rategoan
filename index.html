<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Rategoan</title>
  <script>
    (function () {
      try {
        var v = localStorage.getItem('rategoan_theme') || 'auto';
        var dark = v === 'auto'
          ? !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
          : v === 'dark';
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="css/main.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

  <header id="topbar">
    <button class="menu-circle" id="btn-menu" aria-label="Menu">
      <svg width="20" height="20" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" fill="none">
        <line x1="4" y1="7" x2="20" y2="7"/>
        <line x1="4" y1="12" x2="20" y2="12"/>
        <line x1="4" y1="17" x2="20" y2="17"/>
      </svg>
    </button>
    <div id="model-status"></div>
    <span class="row-spacer"></span>
    <button class="icon-btn" id="btn-chat-search" aria-label="Cari">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
    </button>
  </header>

  <div id="chat-search-bar" class="chat-search-bar" hidden>
    <input id="chat-search-input" class="hist-search-input" type="search" placeholder="Cari di chat ini…" autocomplete="off">
    <span class="set-value" id="chat-search-count">0</span>
    <button class="icon-btn" id="chat-search-prev" aria-label="Sebelumnya">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="19" x2="12" y2="5"/>
        <polyline points="5 12 12 5 19 12"/>
      </svg>
    </button>
    <button class="icon-btn" id="chat-search-next" aria-label="Berikutnya">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="5" x2="12" y2="19"/>
        <polyline points="19 12 12 19 5 12"/>
      </svg>
    </button>
    <button class="icon-btn" id="chat-search-close" aria-label="Tutup">
      <svg width="16" height="16" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" fill="none">
        <line x1="18" y1="6" x2="6" y2="18"/>
        <line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
  </div>

  <main id="app">

    <section id="view-chat" class="view">
      <div id="empty-state" class="empty-state" hidden>
        <div class="empty-brand">Rategoan</div>
      </div>
      <div id="messages"></div>
      <button id="btn-scroll-down" class="scroll-down" hidden aria-label="Ke bawah">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"/>
          <polyline points="19 12 12 19 5 12"/>
        </svg>
        <span id="scroll-badge" class="scroll-badge" hidden></span>
      </button>
      <footer id="composer">
        <div id="composer-card">
          <div id="quote-row" class="attach-row" hidden></div>
          <div id="attach-row" class="attach-row" hidden></div>
          <textarea id="chat-input" rows="1" placeholder="Tanya Rategoan" autocomplete="off"></textarea>
          <div class="card-row">
            <button id="btn-plus" class="icon-btn" aria-label="Attach">
              <svg width="20" height="20" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none">
                <line x1="12" y1="5" x2="12" y2="19"/>
                <line x1="5" y1="12" x2="19" y2="12"/>
              </svg>
            </button>
            <button id="btn-model" class="icon-btn" aria-label="Model">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="4" y="4" width="16" height="16" rx="2"/>
                <rect x="9" y="9" width="6" height="6"/>
                <line x1="9" y1="1" x2="9" y2="4"/>
                <line x1="15" y1="1" x2="15" y2="4"/>
                <line x1="9" y1="20" x2="9" y2="23"/>
                <line x1="15" y1="20" x2="15" y2="23"/>
                <line x1="20" y1="9" x2="23" y2="9"/>
                <line x1="20" y1="14" x2="23" y2="14"/>
                <line x1="1" y1="9" x2="4" y2="9"/>
                <line x1="1" y1="14" x2="4" y2="14"/>
              </svg>
            </button>
            <span id="model-badge" class="model-badge" hidden>RAGET 1.0</span>
            <span class="row-spacer"></span>
            <button id="btn-stop" class="icon-btn" aria-label="Stop">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
                <rect x="5" y="5" width="14" height="14" rx="3"/>
              </svg>
            </button>
            <button id="btn-voice-input" class="icon-btn" aria-label="Voice">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                <line x1="12" y1="19" x2="12" y2="23"/>
              </svg>
            </button>
            <button id="btn-send" class="send-plain" aria-label="Send">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"/>
                <polygon points="22 2 15 22 11 13 2 9 22 2"/>
              </svg>
            </button>
          </div>
        </div>
      </footer>
    </section>

    <section id="view-settings" class="view" hidden>
    </section>

    <section id="view-collection" class="view" hidden>
    </section>

    <section id="view-agentic" class="view" hidden>
    </section>

    <section id="view-login" class="view" hidden>
    </section>

  </main>

  <div id="sheet-backdrop" class="sheet-backdrop"></div>

  <div id="attach-sheet" class="sheet" hidden>
    <div class="sheet-head">
      <div class="sheet-title">Lampirkan</div>
      <button class="hist-del" id="attach-close" aria-label="Close">
        <svg width="14" height="14" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" fill="none">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
    <div class="attach-grid">
      <button class="attach-card" id="sheet-camera">
        <span class="attach-ico">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
            <circle cx="12" cy="13" r="4"/>
          </svg>
        </span>
        Kamera
      </button>
      <button class="attach-card" id="sheet-photo">
        <span class="attach-ico">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <polyline points="21 15 16 10 5 21"/>
          </svg>
        </span>
        Foto
      </button>
      <button class="attach-card" id="sheet-file">
        <span class="attach-ico">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
          </svg>
        </span>
        File
      </button>
    </div>
  </div>

  <div id="camera-overlay" class="pin-overlay camera-overlay" hidden>
    <div class="camera-frame">
      <video id="camera-video" autoplay playsinline muted></video>
      <canvas id="camera-canvas" hidden></canvas>
      <div class="camera-controls">
        <button id="camera-cancel" class="camera-btn-side" aria-label="Batal">
          <svg width="20" height="20" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" fill="none"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
        <button id="camera-shutter" class="camera-shutter" aria-label="Ambil foto"></button>
        <button id="camera-switch" class="camera-btn-side" aria-label="Ganti kamera">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
        </button>
      </div>
    </div>
  </div>

  <input type="file" id="pick-camera" accept="image/*" capture="environment" hidden>
  <input type="file" id="pick-photo" accept="image/*" hidden>
  <input type="file" id="pick-file" hidden>
  <input type="file" id="pick-restore" accept="application/json,.json" hidden>

  <div id="backdrop"></div>
  <aside id="sidebar">

    <div class="zone zone-top">
      <div class="side-head">
        <div class="side-title">Rategoan</div>
      </div>
      <hr class="divider">
      <button id="btn-new-chat" class="side-link">
        <svg class="side-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          <line x1="12" y1="7" x2="12" y2="13"/>
          <line x1="9" y1="10" x2="15" y2="10"/>
        </svg>
        Chat Baru
      </button>
      <button id="btn-collection" class="side-link">
        <svg class="side-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 21 12 16l-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
        </svg>
        Koleksi
      </button>
      <button id="btn-pitutur" class="side-link">
        <svg class="side-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18V5l12-2v13"/>
          <circle cx="6" cy="18" r="3"/>
          <circle cx="18" cy="16" r="3"/>
        </svg>
        Pitutur
      </button>
      <button id="btn-agentic" class="side-link">
        <svg class="side-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="5" y="8" width="14" height="11" rx="2"/>
          <circle cx="9.5" cy="13" r="1.2" fill="currentColor" stroke="none"/>
          <circle cx="14.5" cy="13" r="1.2" fill="currentColor" stroke="none"/>
          <path d="M12 8V4"/>
          <circle cx="12" cy="3" r="1.2" fill="currentColor" stroke="none"/>
          <path d="M2 12h3M19 12h3"/>
        </svg>
        Agentic AI
      </button>
    </div>

    <hr class="divider">

    <div class="zone zone-bottom">
      <div class="hist-head">
        <span>
          <svg class="side-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"/>
            <polyline points="12 7 12 12 15.5 13.5"/>
          </svg>
          Riwayat Chat
        </span>
      </div>
      <div class="hist-search">
        <input id="history-search" class="hist-search-input" type="search" placeholder="Cari riwayat…" autocomplete="off">
      </div>
      <ul id="history-list"></ul>
      <div id="history-empty">Belum ada chat</div>
      <div class="side-footer">
        <button id="btn-settings" class="icon-round plain" aria-label="Pengaturan">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
        <button id="btn-login" class="icon-round right" aria-label="Login">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
            <polyline points="22,6 12,13 2,6"/>
          </svg>
        </button>
      </div>
    </div>

  </aside>

  <div id="pin-overlay" class="pin-overlay" hidden>
    <div class="pin-card">
      <div class="pin-title">Rategoan terkunci</div>
      <input id="pin-input" class="auth-input" type="password" inputmode="numeric" maxlength="6" placeholder="PIN">
      <button id="pin-submit" class="auth-submit">Buka</button>
    </div>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
